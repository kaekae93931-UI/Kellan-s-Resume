<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<title>聊天室管理後台</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;
  background: #f5f7fa;
  color: #1f2937;
}

body {
  overflow: hidden;
}

.topbar {
  height: 72px;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: #111827;
}

.brand p {
  margin: 4px 0 0;
  font-size: 12px;
  color: #9ca3af;
}

.online-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #16a34a;
  font-size: 13px;
  font-weight: 600;
}

.online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 4px #dcfce7;
}

.dashboard {
  height: calc(100vh - 72px);
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  min-width: 0;
}

.sidebar {
  background: #ffffff;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.sidebar-header {
  height: 64px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #f0f1f3;
  flex-shrink: 0;
}

.sidebar-title {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.sidebar-title strong {
  font-size: 15px;
  color: #111827;
}

.session-count {
  font-size: 11px;
  color: #9ca3af;
}

#sessionList {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.session {
  position: relative;
  min-height: 72px;
  padding: 13px 18px;
  border-bottom: 1px solid #f3f4f6;
  cursor: pointer;
  transition:
    background .15s ease,
    border-color .15s ease;
}

.session:hover {
  background: #f8fafc;
}

.session.active {
  background: #f0fdf4;
  border-left: 3px solid #22c55e;
  padding-left: 15px;
}

.session.unread {
  background: #f0fdf4;
}

.session-name {
  font-size: 14px;
  font-weight: 650;
  color: #111827;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 22px;
}

.session-id {
  margin-top: 5px;
  font-size: 10px;
  color: #9ca3af;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-unread {
  position: absolute;
  top: 18px;
  right: 16px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 3px #dcfce7;
}

.empty-sessions {
  padding: 30px 18px;
  text-align: center;
  color: #9ca3af;
  font-size: 13px;
}

.chat-panel {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #f8fafc;
}

.chat-header {
  height: 72px;
  flex-shrink: 0;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 15px;
}

.chat-user {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #111827;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
}

.chat-user > div:last-child {
  min-width: 0;
}

.chat-user strong {
  display: block;
  font-size: 15px;
  color: #111827;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-user span {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  color: #9ca3af;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.delete-button {
  flex-shrink: 0;
  border: 1px solid #fecaca;
  background: #ffffff;
  color: #dc2626;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  cursor: pointer;
}

.delete-button:hover:not(:disabled) {
  background: #fef2f2;
}

.delete-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overscroll-behavior: contain;
}

.empty-messages {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
}

.message {
  max-width: min(72%, 680px);
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.55;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.message-name {
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 4px;
}

.message-time {
  margin-top: 5px;
  font-size: 9px;
  opacity: .55;
}

.message.visitor {
  align-self: flex-start;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  color: #1f2937;
  border-bottom-left-radius: 5px;
}

.message.visitor .message-name {
  color: #16a34a;
}

.message.admin {
  align-self: flex-end;
  background: #dcfce7;
  border: 1px solid #bbf7d0;
  color: #166534;
  border-bottom-right-radius: 5px;
}

.message.admin .message-name {
  color: #15803d;
}

.composer {
  min-height: 72px;
  flex-shrink: 0;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#text {
  min-width: 0;
  flex: 1;
  height: 44px;
  border: 1px solid #d1d5db;
  border-radius: 22px;
  padding: 0 17px;
  outline: none;
  font-size: 14px;
  background: #f9fafb;
}

#text:focus {
  border-color: #86efac;
  background: #ffffff;
  box-shadow: 0 0 0 3px #dcfce7;
}

.send-button {
  width: 72px;
  height: 42px;
  border: 0;
  border-radius: 21px;
  background: #22c55e;
  color: #ffffff;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}

.send-button:hover:not(:disabled) {
  background: #16a34a;
}

.send-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

@media (max-width: 700px) {
  body {
    overflow: hidden;
  }

  .topbar {
    height: 58px;
    padding: 0 14px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .brand p {
    display: none;
  }

  .online-status {
    font-size: 11px;
  }

  .dashboard {
    height: calc(100vh - 58px);
    grid-template-columns: 108px minmax(0, 1fr);
  }

  .sidebar-header {
    height: 52px;
    padding: 0 9px;
  }

  .sidebar-title {
    display: block;
  }

  .sidebar-title strong {
    display: block;
    font-size: 12px;
  }

  .session-count {
    display: block;
    margin-top: 3px;
    font-size: 9px;
  }

  .session {
    min-height: 66px;
    padding: 11px 8px;
  }

  .session.active {
    padding-left: 6px;
  }

  .session-name {
    font-size: 12px;
    padding-right: 13px;
  }

  .session-id {
    display: none;
  }

  .session-unread {
    top: 13px;
    right: 8px;
    width: 7px;
    height: 7px;
    box-shadow: 0 0 0 2px #dcfce7;
  }

  .chat-header {
    height: 60px;
    padding: 0 10px;
  }

  .chat-avatar {
    width: 34px;
    height: 34px;
    font-size: 13px;
  }

  .chat-user {
    gap: 8px;
  }

  .chat-user strong {
    font-size: 13px;
    max-width: 125px;
  }

  .chat-user span {
    font-size: 9px;
    max-width: 125px;
  }

  .delete-button {
    padding: 7px 8px;
    font-size: 10px;
  }

  #messages {
    padding: 12px 9px;
    gap: 7px;
  }

  .message {
    max-width: 82%;
    padding: 8px 10px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.5;
  }

  .message-name {
    font-size: 10px;
    margin-bottom: 3px;
  }

  .message-time {
    font-size: 8px;
    margin-top: 4px;
  }

  .composer {
    min-height: 62px;
    padding: 8px;
    gap: 6px;
  }

  #text {
    height: 42px;
    font-size: 13px;
    padding: 0 13px;
  }

  .send-button {
    width: 56px;
    height: 40px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <h1>聊天室管理後台</h1>
    <p>Chat Administration · Kellan Resume Assistant</p>
  </div>

  <div class="online-status">
    <span class="online-dot"></span>
    System Online
  </div>
</header>

<section class="dashboard">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-title">
        <strong>聊天室列表</strong>

        <span
          id="sessionCount"
          class="session-count"
        >
          0 sessions
        </span>
      </div>
    </div>

    <div id="sessionList"></div>

  </aside>

  <section class="chat-panel">

    <header class="chat-header">

      <div class="chat-user">

        <div class="chat-avatar">
          K
        </div>

        <div>
          <strong id="currentSessionName">
            尚未選擇聊天室
          </strong>

          <span id="currentSessionStatus">
            Select a conversation
          </span>
        </div>

      </div>

      <button
        id="deleteButton"
        class="delete-button"
        type="button"
        disabled
      >
        🗑 刪除紀錄
      </button>

    </header>

    <div id="messages">

      <div class="empty-messages">
        <div>
          <div
            style="
              font-size:32px;
              margin-bottom:10px;
            "
          >
            💬
          </div>

          <div>
            請從左側選擇聊天室
          </div>
        </div>
      </div>

    </div>

    <div class="composer">

      <input
        id="text"
        type="text"
        placeholder="輸入回覆後按 Enter..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        發送
      </button>

    </div>

  </section>

</section>

<script>
const WORKER =
  "https://hung.kaekae939311.workers.dev";

let currentSession = null;
let sessionsCache = [];
let messageHash = "";
let isLoadingMessages = false;
let isSending = false;

const sessionList =
  document.getElementById("sessionList");

const sessionCount =
  document.getElementById("sessionCount");

const messagesBox =
  document.getElementById("messages");

const textInput =
  document.getElementById("text");

const sendButton =
  document.getElementById("sendButton");

const deleteButton =
  document.getElementById("deleteButton");

const currentSessionName =
  document.getElementById("currentSessionName");

const currentSessionStatus =
  document.getElementById("currentSessionStatus");

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeSession(item) {
  if (typeof item === "string") {
    return {
      id: item,
      name: "Anonymous",
      unread: false,
      lastMessageTime: 0
    };
  }

  return {
    id: item.id,
    name: item.name || "Anonymous",
    unread: !!item.unread,
    lastMessageTime:
      Number(item.lastMessageTime) || 0
  };
}

function sessionSignature(list) {
  return JSON.stringify(
    list.map(session => [
      session.id,
      session.name,
      session.unread,
      session.lastMessageTime
    ])
  );
}

function updateChatHeader() {
  if (!currentSession) {
    currentSessionName.textContent =
      "尚未選擇聊天室";

    currentSessionStatus.textContent =
      "Select a conversation";

    deleteButton.disabled = true;

    return;
  }

  const session =
    sessionsCache.find(
      item => item.id === currentSession
    );

  currentSessionName.textContent =
    session?.name || "Anonymous";

  currentSessionStatus.textContent =
    currentSession;

  deleteButton.disabled = false;
}

function renderSessionList(force = false) {
  const normalized =
    sessionsCache.map(normalizeSession);

  const newSignature =
    sessionSignature(normalized);

  if (
    !force &&
    sessionList.dataset.signature ===
      newSignature
  ) {
    return;
  }

  sessionList.dataset.signature =
    newSignature;

  sessionList.innerHTML = "";

  if (!normalized.length) {
    sessionList.innerHTML = `
      <div class="empty-sessions">
        目前沒有聊天室
      </div>
    `;

    return;
  }

  normalized.forEach(session => {
    const div =
      document.createElement("div");

    div.className = "session";

    if (session.id === currentSession) {
      div.classList.add("active");
    }

    if (
      session.unread &&
      session.id !== currentSession
    ) {
      div.classList.add("unread");
    }

    div.dataset.sessionId =
      session.id;

    div.innerHTML = `
      <div class="session-name">
        ${escapeHtml(session.name)}
      </div>

      <div class="session-id">
        ${escapeHtml(session.id)}
      </div>

      ${
        session.unread &&
        session.id !== currentSession
          ? `<span class="session-unread"></span>`
          : ""
      }
    `;

    div.addEventListener(
      "click",
      () => selectSession(session.id)
    );

    sessionList.appendChild(div);
  });
}

async function loadSessions(force = false) {
  try {
    const response =
      await fetch(
        `${WORKER}/sessions`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Sessions request failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {
      throw new Error(
        "Invalid sessions response"
      );
    }

    sessionsCache =
      data.map(normalizeSession);

    sessionCount.textContent =
      `${sessionsCache.length} sessions`;

    if (
      currentSession &&
      !sessionsCache.some(
        session =>
          session.id === currentSession
      )
    ) {
      currentSession = null;
      messageHash = "";
      showEmptyMessages(
        "聊天室已刪除"
      );
    }

    renderSessionList(force);
    updateChatHeader();

  } catch (error) {
    console.error(
      "loadSessions error:",
      error
    );
  }
}

async function selectSession(sessionId) {
  currentSession = sessionId;
  messageHash = "";

  renderSessionList(true);
  updateChatHeader();

  const session =
    sessionsCache.find(
      item => item.id === sessionId
    );

  if (session) {
    session.unread = false;
  }

  try {
    await fetch(
      `${WORKER}/sessions/read`,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          sessionId
        })
      }
    );
  } catch (error) {
    console.error(
      "mark read error:",
      error
    );
  }

  renderSessionList(true);
  await loadMessages();
}

function showEmptyMessages(text) {
  messagesBox.innerHTML = `
    <div class="empty-messages">
      <div>
        <div
          style="
            font-size:32px;
            margin-bottom:10px;
          "
        >
          💬
        </div>

        <div>
          ${escapeHtml(text)}
        </div>
      </div>
    </div>
  `;
}

function formatTime(timestamp) {
  return new Date(
    timestamp
  ).toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function getMessageHash(messages) {
  return JSON.stringify(
    messages.map(message => [
      message.role || "",
      message.name || "",
      message.text || "",
      message.time || ""
    ])
  );
}

function renderMessages(messages) {
  const wasNearBottom =
    messagesBox.scrollHeight -
    messagesBox.scrollTop -
    messagesBox.clientHeight <
    100;

  messagesBox.innerHTML = "";

  if (!messages.length) {
    showEmptyMessages(
      "這個聊天室目前沒有訊息"
    );
    return;
  }

  messages.forEach(message => {
    const div =
      document.createElement("div");

    const isAdmin =
      message.role === "admin";

    div.className =
      isAdmin
        ? "message admin"
        : "message visitor";

    const name =
      isAdmin
        ? "Kellan"
        : (
            message.name ||
            "Anonymous"
          );

    const time =
      message.time
        ? formatTime(message.time)
        : "";

    div.innerHTML = `
      <div class="message-name">
        ${escapeHtml(name)}
      </div>

      <div>
        ${escapeHtml(
          message.text || ""
        ).replace(/\n/g, "<br>")}
      </div>

      ${
        time
          ? `
            <div class="message-time">
              ${escapeHtml(time)}
            </div>
          `
          : ""
      }
    `;

    messagesBox.appendChild(div);
  });

  if (wasNearBottom) {
    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  }
}

async function loadMessages() {
  if (!currentSession) {
    showEmptyMessages(
      "請從左側選擇聊天室"
    );
    return;
  }

  if (isLoadingMessages) {
    return;
  }

  isLoadingMessages = true;

  try {
    const response =
      await fetch(
        `${WORKER}/messages?sessionId=${encodeURIComponent(
          currentSession
        )}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Messages request failed: ${response.status}`
      );
    }

    const messages =
      await response.json();

    if (!Array.isArray(messages)) {
      throw new Error(
        "Invalid messages response"
      );
    }

    const newHash =
      getMessageHash(messages);

    if (newHash !== messageHash) {
      messageHash = newHash;
      renderMessages(messages);
    }

  } catch (error) {
    console.error(
      "loadMessages error:",
      error
    );
  } finally {
    isLoadingMessages = false;
  }
}

async function reply() {
  if (!currentSession) {
    alert("請先選擇聊天室");
    return;
  }

  const text =
    textInput.value.trim();

  if (!text || isSending) {
    return;
  }

  isSending = true;
  sendButton.disabled = true;

  try {
    const response =
      await fetch(
        `${WORKER}/reply`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text,
            sessionId:
              currentSession
          })
        }
      );

    if (!response.ok) {
      throw new Error(
        `Reply failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Reply failed"
      );
    }

    textInput.value = "";

    await loadMessages();
    await loadSessions();

    textInput.focus();

  } catch (error) {
    console.error(
      "reply error:",
      error
    );

    alert(
      "發送失敗，請稍後再試。"
    );
  } finally {
    isSending = false;
    sendButton.disabled = false;
  }
}

async function deleteCurrentSession() {
  if (!currentSession) {
    return;
  }

  const sessionToDelete =
    currentSession;

  const confirmed =
    confirm(
      "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
    );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled = true;

  try {
    const response =
      await fetch(
        `${WORKER}/sessions?sessionId=${encodeURIComponent(
          sessionToDelete
        )}`,
        {
          method: "DELETE"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Delete failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    currentSession = null;
    messageHash = "";

    showEmptyMessages(
      "聊天紀錄已刪除"
    );

    updateChatHeader();

    await loadSessions(true);

  } catch (error) {
    console.error(
      "deleteCurrentSession error:",
      error
    );

    alert(
      "刪除失敗，請稍後再試。"
    );

    deleteButton.disabled =
      !currentSession;
  }
}

sendButton.addEventListener(
  "click",
  reply
);

deleteButton.addEventListener(
  "click",
  deleteCurrentSession
);

textInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      reply();
    }
  }
);

async function refresh() {
  await loadSessions(false);

  if (currentSession) {
    await loadMessages();
  }
}

async function init() {
  await loadSessions(true);

  if (
    sessionsCache.length &&
    !currentSession
  ) {
    await selectSession(
      sessionsCache[0].id
    );
  }
}

init();

setInterval(
  refresh,
  2000
);
</script>
