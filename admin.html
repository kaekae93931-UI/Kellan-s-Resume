<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>聊天室管理後台</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#07111f;color:#e8eef7}
body{overflow:hidden}
button,input{font:inherit}

.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0b1728;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{margin:0;font-size:20px;font-weight:700}
.brand p{margin:5px 0 0;color:#718096;font-size:12px}
.online-status{display:flex;align-items:center;gap:8px;font-size:13px;color:#9fb3c8}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.7)}

.dashboard{height:calc(100vh - 76px);display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}

.sidebar{min-width:0;background:#091524;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{height:64px;flex:0 0 64px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.sidebar-title strong{font-size:15px}
.session-count{font-size:11px;color:#6f8297;background:#101f32;border:1px solid rgba(255,255,255,.06);padding:4px 8px;border-radius:999px;white-space:nowrap}

#sessionList{flex:1;overflow-y:auto;overflow-x:hidden}
.session{position:relative;display:flex;flex-direction:column;gap:5px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:background .15s}
.session:hover{background:rgba(255,255,255,.035)}
.session.active{background:rgba(59,130,246,.12)}
.session.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#3b82f6}
.session-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.session-name{font-size:14px;font-weight:600;color:#edf4fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-id{font-size:10px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-time{font-size:10px;color:#66788c;white-space:nowrap}
.new-badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:18px;padding:0 6px;border-radius:999px;background:#22c55e;color:#04130a;font-size:9px;font-weight:800;line-height:1}
.empty-sessions{padding:40px 20px;text-align:center;color:#64748b;font-size:13px}

.chat-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#07111f}
.chat-header{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b1728;border-bottom:1px solid rgba(255,255,255,.08)}
.chat-user{display:flex;align-items:center;gap:12px;min-width:0}
.chat-avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563eb,#38bdf8);font-weight:700;color:white}
.chat-user>div:last-child{min-width:0}
#currentSessionName{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#currentSessionStatus{display:block;margin-top:3px;font-size:11px;color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.delete-button{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#fca5a5;padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.delete-button:hover:not(:disabled){background:rgba(239,68,68,.15)}
.delete-button:disabled{opacity:.35;cursor:not-allowed}

#messages{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:10px}
.empty-messages{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#64748b;font-size:13px}
.message{max-width:min(72%,680px);padding:11px 14px;border-radius:13px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.message-name{font-size:10px;font-weight:700;margin-bottom:4px;opacity:.75}
.message-time{margin-top:5px;font-size:9px;opacity:.5}
.message.visitor{align-self:flex-start;background:#132337;border:1px solid rgba(255,255,255,.06);border-top-left-radius:4px;color:#dce8f5}
.message.admin{align-self:flex-end;background:#075e54;border:1px solid rgba(34,197,94,.18);border-top-right-radius:4px;color:#eafff9}
.message.new-message{box-shadow:0 0 0 2px rgba(34,197,94,.35),0 0 18px rgba(34,197,94,.12)}

.composer{height:76px;flex:0 0 76px;display:flex;gap:10px;padding:14px 20px;background:#0b1728;border-top:1px solid rgba(255,255,255,.08)}
#text{flex:1;min-width:0;border:1px solid rgba(255,255,255,.09);background:#111f31;color:#e8eef7;border-radius:10px;padding:0 14px;outline:none}
#text:focus{border-color:rgba(59,130,246,.6)}
.send-button{width:72px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
.send-button:hover:not(:disabled){background:#1d4ed8}
.send-button:disabled{opacity:.5;cursor:not-allowed}

.mobile-back{display:none;border:0;background:transparent;color:#dbeafe;font-size:25px;padding:0 8px 0 0;cursor:pointer}
.chat-header-left{display:flex;align-items:center;min-width:0}

@media(max-width:760px){
body{overflow:hidden}
.topbar{height:62px;padding:0 16px}
.brand h1{font-size:17px}
.brand p{display:none}
.online-status{font-size:11px}
.dashboard{height:calc(100vh - 62px);display:block;position:relative}
.sidebar{position:absolute;inset:0;width:100%;border-right:0;z-index:2}
.chat-panel{position:absolute;inset:0;z-index:3;display:none}
.dashboard.mobile-chat .sidebar{display:none}
.dashboard.mobile-chat .chat-panel{display:flex}

.sidebar-header{height:58px;flex-basis:58px;padding:0 16px}
.session{padding:14px 16px;min-height:68px}
.session-name{font-size:15px}
.session-id{font-size:9px}

.chat-header{height:60px;flex-basis:60px;padding:0 12px}
.chat-header-left{min-width:0;flex:1}
.mobile-back{display:block}
.chat-avatar{width:38px;height:38px;flex-basis:38px}
#currentSessionName{font-size:14px}
.delete-button{padding:7px 9px;font-size:12px}

#messages{padding:14px 12px 12px;gap:8px}
.message{max-width:82%;padding:9px 12px;font-size:14px;border-radius:15px}
.message-name{font-size:10px}
.message-time{font-size:8px}

.composer{height:62px;flex-basis:62px;padding:9px 10px;padding-bottom:max(9px,env(safe-area-inset-bottom));gap:7px}
#text{height:44px;padding:0 12px;font-size:14px}
.send-button{height:44px;width:60px;font-size:13px}
}

@media(min-width:761px){
.chat-header-left{display:flex}
}

@media(max-width:420px){
.delete-button{font-size:0;width:38px;height:38px;padding:0}
.delete-button:first-letter{font-size:16px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <h1>聊天室管理後台</h1>
    <p>Chat Administration · Kellan Resume Assistant</p>
  </div>

  <div class="online-status">
    <span class="online-dot"></span>
    System Online
  </div>
</header>

<section class="dashboard" id="dashboard">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-title">
        <strong>聊天室列表</strong>
        <span id="sessionCount" class="session-count">0 sessions</span>
      </div>
    </div>

    <div id="sessionList"></div>

  </aside>

  <section class="chat-panel">

    <header class="chat-header">

      <div class="chat-header-left">

        <button
          id="mobileBackButton"
          class="mobile-back"
          type="button"
          aria-label="返回聊天室列表"
        >
          ‹
        </button>

        <div class="chat-user">

          <div class="chat-avatar">
            K
          </div>

          <div>
            <strong id="currentSessionName">
              尚未選擇聊天室
            </strong>

            <span id="currentSessionStatus">
              Select a conversation
            </span>
          </div>

        </div>

      </div>

      <button
        id="deleteButton"
        class="delete-button"
        type="button"
        disabled
      >
        🗑 刪除紀錄
      </button>

    </header>

    <div id="messages">

      <div class="empty-messages">

        <div>

          <div style="font-size:32px;margin-bottom:10px">
            💬
          </div>

          <div>
            請從左側選擇聊天室
          </div>

        </div>

      </div>

    </div>

    <div class="composer">

      <input
        id="text"
        type="text"
        placeholder="輸入回覆後按 Enter..."
        autocomplete="off"
      />

      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        發送
      </button>

    </div>

  </section>

</section>

<script>
const WORKER =
  "https://hung.kaekae939311.workers.dev";

let currentSession = null;

const sessionList =
  document.getElementById("sessionList");

const sessionCount =
  document.getElementById("sessionCount");

const messagesBox =
  document.getElementById("messages");

const textInput =
  document.getElementById("text");

const sendButton =
  document.getElementById("sendButton");

const deleteButton =
  document.getElementById("deleteButton");

const currentSessionName =
  document.getElementById("currentSessionName");

const currentSessionStatus =
  document.getElementById("currentSessionStatus");

const dashboard =
  document.getElementById("dashboard");

const mobileBackButton =
  document.getElementById("mobileBackButton");

const sessionElements =
  new Map();

const sessionStates =
  new Map();

let currentMessagesHash = "";
let isReplying = false;
let loadingMessages = false;

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatTime(timestamp) {
  if (!timestamp) {
    return "";
  }

  return new Date(timestamp).toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function getMessageHash(messages) {
  return JSON.stringify(
    messages.map(message => [
      message.role || "",
      message.name || "",
      message.text || "",
      message.time || ""
    ])
  );
}

function getLastVisitorMessage(messages) {
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === "visitor") {
      return messages[i];
    }
  }

  return null;
}

function getDisplayName(messages) {
  const visitorMessage =
    messages.find(
      message =>
        message.role === "visitor" &&
        message.name
    );

  return visitorMessage
    ? visitorMessage.name
    : "Anonymous";
}

function showEmptyMessages(text) {
  messagesBox.innerHTML = `
    <div class="empty-messages">
      <div>
        <div style="font-size:32px;margin-bottom:10px">
          💬
        </div>
        <div>
          ${escapeHtml(text)}
        </div>
      </div>
    </div>
  `;
}

function updateChatHeader() {
  if (!currentSession) {
    currentSessionName.textContent =
      "尚未選擇聊天室";

    currentSessionStatus.textContent =
      "Select a conversation";

    deleteButton.disabled = true;

    return;
  }

  const state =
    sessionStates.get(currentSession);

  currentSessionName.textContent =
    state?.name || "Anonymous";

  currentSessionStatus.textContent =
    currentSession;

  deleteButton.disabled = false;
}

function updateSessionElement(
  id,
  messages,
  forceNew = false
) {
  let div =
    sessionElements.get(id);

  const displayName =
    getDisplayName(messages);

  const lastMessage =
    messages.length
      ? messages[messages.length - 1]
      : null;

  const state =
    sessionStates.get(id) || {
      hash: "",
      seen: false,
      name: "Anonymous"
    };

  const oldHash =
    state.hash;

  const newHash =
    getMessageHash(messages);

  const hasNewVisitorMessage =
    lastMessage &&
    lastMessage.role === "visitor" &&
    newHash !== oldHash;

  state.hash = newHash;
  state.name = displayName;

  if (forceNew) {
    state.seen = false;
  }

  if (id === currentSession) {
    state.seen = true;
  }

  sessionStates.set(id, state);

  if (!div) {
    div =
      document.createElement("div");

    div.className = "session";
    div.dataset.sessionId = id;

    div.addEventListener(
      "click",
      async () => {
        await selectSession(id);
      }
    );

    sessionElements.set(id, div);
    sessionList.appendChild(div);
  }

  const showNew =
    id !== currentSession &&
    !state.seen &&
    (hasNewVisitorMessage || forceNew);

  div.innerHTML = `
    <div class="session-top">
      <div class="session-name">
        ${escapeHtml(displayName)}
      </div>

      ${
        showNew
          ? `<span class="new-badge">NEW</span>`
          : ""
      }
    </div>

    <div class="session-id">
      ${escapeHtml(id)}
    </div>

    ${
      lastMessage?.time
        ? `<div class="session-time">
             ${formatTime(lastMessage.time)}
           </div>`
        : ""
    }
  `;

  div.classList.toggle(
    "active",
    id === currentSession
  );
}

async function fetchSessions() {
  const res =
    await fetch(
      `${WORKER}/sessions`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!res.ok) {
    throw new Error(
      `Sessions request failed: ${res.status}`
    );
  }

  const data =
    await res.json();

  if (!Array.isArray(data)) {
    throw new Error(
      "Invalid sessions response."
    );
  }

  return data;
}

async function fetchMessages(sessionId) {
  const res =
    await fetch(
      `${WORKER}/messages?sessionId=${encodeURIComponent(
        sessionId
      )}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!res.ok) {
    throw new Error(
      `Messages request failed: ${res.status}`
    );
  }

  const data =
    await res.json();

  if (!Array.isArray(data)) {
    throw new Error(
      "Invalid messages response."
    );
  }

  return data;
}

async function loadSessions() {
  try {
    const sessions =
      await fetchSessions();

    sessionCount.textContent =
      `${sessions.length} sessions`;

    if (!sessions.length) {
      sessionList.innerHTML = `
        <div class="empty-sessions">
          目前沒有聊天室
        </div>
      `;

      sessionElements.clear();
      sessionStates.clear();
      currentSession = null;

      updateChatHeader();
      showEmptyMessages(
        "目前沒有任何聊天室"
      );

      dashboard.classList.remove(
        "mobile-chat"
      );

      return;
    }

    const sessionSet =
      new Set(sessions);

    for (const id of sessionElements.keys()) {
      if (!sessionSet.has(id)) {
        const element =
          sessionElements.get(id);

        if (element) {
          element.remove();
        }

        sessionElements.delete(id);
        sessionStates.delete(id);
      }
    }

    if (
      currentSession &&
      !sessionSet.has(currentSession)
    ) {
      currentSession = null;
      currentMessagesHash = "";

      dashboard.classList.remove(
        "mobile-chat"
      );

      updateChatHeader();

      showEmptyMessages(
        "這個聊天室已被刪除"
      );
    }

    const results =
      await Promise.all(
        sessions.map(
          async id => {
            try {
              const messages =
                await fetchMessages(id);

              return {
                id,
                messages
              };
            } catch (error) {
              console.error(
                "load session messages error:",
                error
              );

              return {
                id,
                messages: []
              };
            }
          }
        )
      );

    results.forEach(
      ({ id, messages }) => {
        updateSessionElement(
          id,
          messages
        );
      }
    );

    sessions.forEach(
      id => {
        const element =
          sessionElements.get(id);

        if (element) {
          sessionList.appendChild(
            element
          );
        }
      }
    );

    if (
      !currentSession &&
      sessions.length > 0
    ) {
      await selectSession(
        sessions[0],
        false
      );
    }

  } catch (error) {
    console.error(
      "loadSessions error:",
      error
    );
  }
}

async function selectSession(
  id,
  mobile = true
) {
  currentSession = id;
  currentMessagesHash = "";

  document
    .querySelectorAll(".session")
    .forEach(
      element => {
        element.classList.toggle(
          "active",
          element.dataset.sessionId === id
        );
      }
    );

  const state =
    sessionStates.get(id);

  if (state) {
    state.seen = true;
    sessionStates.set(id, state);
  }

  const element =
    sessionElements.get(id);

  if (element) {
    const badge =
      element.querySelector(
        ".new-badge"
      );

    if (badge) {
      badge.remove();
    }
  }

  updateChatHeader();

  if (
    mobile &&
    window.innerWidth <= 760
  ) {
    dashboard.classList.add(
      "mobile-chat"
    );
  }

  await loadMessages();
}

async function loadMessages() {
  if (!currentSession) {
    showEmptyMessages(
      "請從左側選擇聊天室"
    );

    return;
  }

  if (loadingMessages) {
    return;
  }

  loadingMessages = true;

  try {
    const sessionAtStart =
      currentSession;

    const data =
      await fetchMessages(
        sessionAtStart
      );

    if (
      sessionAtStart !== currentSession
    ) {
      return;
    }

    const newHash =
      getMessageHash(data);

    if (
      newHash === currentMessagesHash
    ) {
      return;
    }

    const oldHash =
      currentMessagesHash;

    currentMessagesHash =
      newHash;

    const state =
      sessionStates.get(
        sessionAtStart
      ) || {
        hash: "",
        seen: true,
        name: "Anonymous"
      };

    state.hash = newHash;
    state.name =
      getDisplayName(data);
    state.seen = true;

    sessionStates.set(
      sessionAtStart,
      state
    );

    updateChatHeader();

    messagesBox.innerHTML = "";

    if (!data.length) {
      showEmptyMessages(
        "這個聊天室目前沒有訊息"
      );

      return;
    }

    data.forEach(
      message => {
        const div =
          document.createElement("div");

        div.className =
          message.role === "admin"
            ? "message admin"
            : "message visitor";

        const name =
          message.role === "admin"
            ? "Kellan"
            : (
                message.name ||
                "Visitor"
              );

        const time =
          message.time
            ? formatTime(message.time)
            : "";

        const isNew =
          oldHash &&
          message.role === "visitor" &&
          data[data.length - 1] === message;

        if (isNew) {
          div.classList.add(
            "new-message"
          );
        }

        div.innerHTML = `
          <div class="message-name">
            ${escapeHtml(name)}
          </div>

          <div>
            ${escapeHtml(message.text || "")}
          </div>

          ${
            time
              ? `
                <div class="message-time">
                  ${time}
                </div>
              `
              : ""
          }
        `;

        messagesBox.appendChild(div);
      }
    );

    messagesBox.scrollTop =
      messagesBox.scrollHeight;

  } catch (error) {
    console.error(
      "loadMessages error:",
      error
    );
  } finally {
    loadingMessages = false;
  }
}

async function reply() {
  if (!currentSession) {
    alert(
      "請先選擇聊天室"
    );

    return;
  }

  const text =
    textInput.value.trim();

  if (!text) {
    return;
  }

  if (isReplying) {
    return;
  }

  isReplying = true;
  sendButton.disabled = true;

  try {
    const res =
      await fetch(
        `${WORKER}/reply`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text,
            sessionId:
              currentSession
          })
        }
      );

    if (!res.ok) {
      throw new Error(
        `Reply failed: ${res.status}`
      );
    }

    const data =
      await res.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Reply failed"
      );
    }

    textInput.value = "";

    await loadMessages();
    await refreshCurrentSession();

    textInput.focus();

  } catch (error) {
    console.error(
      "reply error:",
      error
    );

    alert(
      "發送失敗，請稍後再試。"
    );

  } finally {
    isReplying = false;
    sendButton.disabled = false;
  }
}

async function refreshCurrentSession() {
  if (!currentSession) {
    return;
  }

  try {
    const id =
      currentSession;

    const messages =
      await fetchMessages(id);

    updateSessionElement(
      id,
      messages
    );
  } catch (error) {
    console.error(
      "refreshCurrentSession error:",
      error
    );
  }
}

async function deleteCurrentSession() {
  if (!currentSession) {
    return;
  }

  const sessionToDelete =
    currentSession;

  const confirmed =
    confirm(
      "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
    );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled =
    true;

  try {
    const res =
      await fetch(
        `${WORKER}/sessions?sessionId=${encodeURIComponent(
          sessionToDelete
        )}`,
        {
          method: "DELETE"
        }
      );

    if (!res.ok) {
      throw new Error(
        `Delete failed: ${res.status}`
      );
    }

    const data =
      await res.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    const element =
      sessionElements.get(
        sessionToDelete
      );

    if (element) {
      element.remove();
    }

    sessionElements.delete(
      sessionToDelete
    );

    sessionStates.delete(
      sessionToDelete
    );

    currentSession = null;
    currentMessagesHash = "";

    dashboard.classList.remove(
      "mobile-chat"
    );

    updateChatHeader();

    showEmptyMessages(
      "聊天紀錄已刪除"
    );

    await loadSessions();

  } catch (error) {
    console.error(
      "deleteCurrentSession error:",
      error
    );

    alert(
      "刪除失敗，請確認 Worker DELETE /sessions 功能已部署。"
    );

  } finally {
    deleteButton.disabled =
      !currentSession;
  }
}

async function syncCurrentMessages() {
  if (!currentSession) {
    return;
  }

  try {
    const data =
      await fetchMessages(
        currentSession
      );

    const newHash =
      getMessageHash(data);

    if (
      newHash === currentMessagesHash
    ) {
      return;
    }

    await loadMessages();

    updateSessionElement(
      currentSession,
      data
    );

  } catch (error) {
    console.error(
      "syncCurrentMessages error:",
      error
    );
  }
}

async function syncSessionsOnly() {
  try {
    const sessions =
      await fetchSessions();

    sessionCount.textContent =
      `${sessions.length} sessions`;

    const sessionSet =
      new Set(sessions);

    for (const id of sessionElements.keys()) {
      if (!sessionSet.has(id)) {
        const element =
          sessionElements.get(id);

        if (element) {
          element.remove();
        }

        sessionElements.delete(id);
        sessionStates.delete(id);
      }
    }

    if (
      currentSession &&
      !sessionSet.has(currentSession)
    ) {
      currentSession = null;
      currentMessagesHash = "";

      dashboard.classList.remove(
        "mobile-chat"
      );

      updateChatHeader();

      showEmptyMessages(
        "這個聊天室已被刪除"
      );
    }

    if (!sessions.length) {
      if (
        sessionList.children.length !== 1 ||
        !sessionList.querySelector(
          ".empty-sessions"
        )
      ) {
        sessionList.innerHTML = `
          <div class="empty-sessions">
            目前沒有聊天室
          </div>
        `;
      }

      return;
    }

    const empty =
      sessionList.querySelector(
        ".empty-sessions"
      );

    if (empty) {
      empty.remove();
    }

    for (const id of sessions) {
      try {
        const messages =
          await fetchMessages(id);

        updateSessionElement(
          id,
          messages
        );
      } catch (error) {
        console.error(
          "sync session error:",
          error
        );
      }
    }

    sessions.forEach(
      id => {
        const element =
          sessionElements.get(id);

        if (element) {
          sessionList.appendChild(
            element
          );
        }
      }
    );

    if (
      !currentSession &&
      sessions.length
    ) {
      await selectSession(
        sessions[0],
        false
      );
    }

  } catch (error) {
    console.error(
      "syncSessionsOnly error:",
      error
    );
  }
}

sendButton.addEventListener(
  "click",
  reply
);

deleteButton.addEventListener(
  "click",
  deleteCurrentSession
);

mobileBackButton.addEventListener(
  "click",
  () => {
    dashboard.classList.remove(
      "mobile-chat"
    );
  }
);

textInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      reply();
    }
  }
);

window.addEventListener(
  "resize",
  () => {
    if (
      window.innerWidth > 760
    ) {
      dashboard.classList.remove(
        "mobile-chat"
      );
    }
  }
);

async function initialLoad() {
  await loadSessions();
}

initialLoad();

setInterval(
  async () => {
    await syncSessionsOnly();

    if (currentSession) {
      await syncCurrentMessages();
    }
  },
  2000
);
</script>

</body>
</html>
