<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>聊天室管理後台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #07111f;
      color: #e5edf7;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      width: 100%;
      height: 72px;
      min-height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0a1627;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #f5f9ff;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #71829a;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8ea0b8;
      font-size: 12px;
      white-space: nowrap;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,.7);
    }

    .dashboard {
      width: 100%;
      height: calc(100vh - 72px);
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      width: 310px;
      min-width: 310px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #091525;
      border-right: 1px solid rgba(255,255,255,.07);
      overflow: hidden;
    }

    .sidebar-header {
      height: 64px;
      min-height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .sidebar-title {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sidebar-title strong {
      font-size: 14px;
      color: #eef5ff;
    }

    .session-count {
      color: #71829a;
      font-size: 11px;
    }

    #sessionList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
    }

    .session {
      position: relative;
      width: 100%;
      padding: 12px 13px;
      margin-bottom: 5px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .session:hover {
      background: rgba(255,255,255,.035);
    }

    .session.active {
      background: rgba(37,99,235,.14);
      border-color: rgba(59,130,246,.28);
    }

    .session.has-new {
      border-left: 3px solid #22c55e;
      background: rgba(34,197,94,.08);
    }

    .session.has-new .session-name {
      color: #4ade80;
    }

    .session-name {
      color: #e8eef7;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 8px;
    }

    .session-id {
      margin-top: 3px;
      color: #61728a;
      font-size: 9px;
      line-height: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .new-dot {
      position: absolute;
      top: 13px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,.75);
    }

    .empty-sessions {
      padding: 30px 12px;
      text-align: center;
      color: #607089;
      font-size: 12px;
    }

    .chat-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b1727;
      overflow: hidden;
    }

    .chat-header {
      width: 100%;
      height: 68px;
      min-height: 68px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: #0c192b;
    }

    .chat-user {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .chat-user > div:last-child {
      min-width: 0;
    }

    #currentSessionName {
      display: block;
      color: #f3f7fd;
      font-size: 14px;
      line-height: 19px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #currentSessionStatus {
      display: block;
      margin-top: 2px;
      color: #71829a;
      font-size: 10px;
      line-height: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-button {
      flex-shrink: 0;
      border: 1px solid rgba(239,68,68,.25);
      background: rgba(239,68,68,.08);
      color: #f87171;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-button:hover:not(:disabled) {
      background: rgba(239,68,68,.16);
    }

    .delete-button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .empty-messages {
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #63748c;
      text-align: center;
      font-size: 13px;
    }

    .message {
      position: relative;
      width: fit-content;
      max-width: min(72%, 650px);
      margin-bottom: 12px;
      padding: 9px 12px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.visitor {
      margin-right: auto;
      background: #12253a;
      border: 1px solid rgba(255,255,255,.06);
      color: #e5edf7;
      border-bottom-left-radius: 4px;
    }

    .message.admin {
      margin-left: auto;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.new-message {
      background: #166534;
      border-color: rgba(74,222,128,.45);
      box-shadow: 0 0 0 1px rgba(34,197,94,.12);
    }

    .message-name {
      margin-bottom: 3px;
      font-size: 10px;
      font-weight: 700;
      opacity: .7;
    }

    .message-time {
      margin-top: 5px;
      font-size: 9px;
      opacity: .5;
    }

    .composer {
      width: 100%;
      min-height: 68px;
      height: 68px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-top: 1px solid rgba(255,255,255,.07);
      background: #0c192b;
    }

    .composer input {
      min-width: 0;
      flex: 1;
      height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px;
      outline: none;
      background: #091525;
      color: #edf4fd;
      font-size: 14px;
    }

    .composer input::placeholder {
      color: #607089;
    }

    .composer input:focus {
      border-color: rgba(59,130,246,.55);
    }

    .send-button {
      width: 68px;
      min-width: 68px;
      height: 44px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .send-button:hover:not(:disabled) {
      background: #3b82f6;
    }

    .send-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
      }

      body {
        height: 100dvh;
      }

      .topbar {
        height: 58px;
        min-height: 58px;
        padding: 0 14px;
      }

      .brand h1 {
        font-size: 17px;
        line-height: 20px;
      }

      .brand p {
        display: none;
      }

      .online-status {
        font-size: 10px;
      }

      .dashboard {
        width: 100%;
        height: calc(100dvh - 58px);
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 92px;
        min-height: 92px;
        max-height: 92px;
        flex: 0 0 92px;
        border-right: 0;
        border-bottom: 1px solid rgba(255,255,255,.07);
        overflow: hidden;
      }

      .sidebar-header {
        height: 40px;
        min-height: 40px;
        padding: 0 14px;
      }

      #sessionList {
        width: 100%;
        height: 52px;
        min-height: 52px;
        padding: 5px 12px 7px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .session {
        flex: 0 0 auto;
        width: 145px;
        min-width: 145px;
        max-width: 180px;
        height: 40px;
        min-height: 40px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 9px;
      }

      .session-name {
        font-size: 12px;
        line-height: 16px;
      }

      .session-id {
        font-size: 8px;
        line-height: 11px;
      }

      .new-dot {
        top: 10px;
        right: 9px;
      }

      .chat-panel {
        width: 100%;
        height: calc(100dvh - 150px);
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .chat-header {
        height: 58px;
        min-height: 58px;
        flex: 0 0 58px;
        padding: 8px 10px;
      }

      .chat-avatar {
        width: 36px;
        height: 36px;
        min-width: 36px;
        font-size: 14px;
      }

      #currentSessionName {
        max-width: 180px;
        font-size: 13px;
        line-height: 17px;
      }

      #currentSessionStatus {
        max-width: 180px;
        font-size: 9px;
        line-height: 13px;
      }

      .delete-button {
        padding: 7px 8px;
        font-size: 10px;
      }

      #messages {
        min-height: 0;
        flex: 1 1 auto;
        padding: 10px 9px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .message {
        max-width: 82%;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.45;
      }

      .message-name {
        font-size: 9px;
      }

      .message-time {
        font-size: 8px;
      }

      .composer {
        width: 100%;
        height: 58px;
        min-height: 58px;
        flex: 0 0 58px;
        padding: 8px 9px;
        gap: 7px;
      }

      .composer input {
        width: 100%;
        height: 42px;
        font-size: 14px;
        border-radius: 21px;
        padding: 0 13px;
      }

      .send-button {
        width: 58px;
        min-width: 58px;
        height: 42px;
        border-radius: 21px;
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .topbar {
        padding: 0 10px;
      }

      .brand h1 {
        font-size: 16px;
      }

      .online-status {
        font-size: 9px;
      }

      .sidebar {
        height: 88px;
        min-height: 88px;
        max-height: 88px;
        flex-basis: 88px;
      }

      .chat-panel {
        height: calc(100dvh - 146px);
      }

      .session {
        width: 132px;
        min-width: 132px;
      }

      .delete-button {
        padding: 6px;
        font-size: 9px;
      }

      #currentSessionName,
      #currentSessionStatus {
        max-width: 145px;
      }

      .message {
        max-width: 86%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <h1>聊天室管理後台</h1>
      <p>Chat Administration · Kellan Resume Assistant</p>
    </div>

    <div class="online-status">
      <span class="online-dot"></span>
      System Online
    </div>
  </header>

  <section class="dashboard">

    <aside class="sidebar">

      <div class="sidebar-header">
        <div class="sidebar-title">
          <strong>聊天室列表</strong>

          <span
            id="sessionCount"
            class="session-count"
          >
            0 sessions
          </span>
        </div>
      </div>

      <div id="sessionList"></div>

    </aside>

    <section class="chat-panel">

      <header class="chat-header">

        <div class="chat-user">

          <div class="chat-avatar">
            K
          </div>

          <div>
            <strong id="currentSessionName">
              尚未選擇聊天室
            </strong>

            <span id="currentSessionStatus">
              Select a conversation
            </span>
          </div>

        </div>

        <button
          id="deleteButton"
          class="delete-button"
          type="button"
          disabled
        >
          🗑 刪除紀錄
        </button>

      </header>

      <div id="messages">

        <div class="empty-messages">
          <div>
            <div
              style="
                font-size:32px;
                margin-bottom:10px;
              "
            >
              💬
            </div>

            <div>
              請從左側選擇聊天室
            </div>
          </div>
        </div>

      </div>

      <div class="composer">

        <input
          id="text"
          type="text"
          placeholder="輸入回覆後按 Enter..."
          autocomplete="off"
        >

        <button
          id="sendButton"
          class="send-button"
          type="button"
        >
          發送
        </button>

      </div>

    </section>

  </section>

  <script>
    const WORKER =
      "https://hung.kaekae939311.workers.dev";

    let currentSession = null;
    let sessionsCache = [];
    let messageHashes = {};
    let newSessions = new Set();
    let isLoadingMessages = false;

    const sessionList =
      document.getElementById("sessionList");

    const sessionCount =
      document.getElementById("sessionCount");

    const messagesBox =
      document.getElementById("messages");

    const textInput =
      document.getElementById("text");

    const sendButton =
      document.getElementById("sendButton");

    const deleteButton =
      document.getElementById("deleteButton");

    const currentSessionName =
      document.getElementById("currentSessionName");

    const currentSessionStatus =
      document.getElementById("currentSessionStatus");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);

      return date.toLocaleString(
        "zh-TW",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    function getMessageHash(messages) {
      return JSON.stringify(
        messages.map(message => [
          message.role || "",
          message.name || "",
          message.text || "",
          message.time || ""
        ])
      );
    }

    function getVisitorName(messages) {
      const visitorMessage =
        messages.find(
          message =>
            message.role === "visitor" &&
            message.name
        );

      return visitorMessage
        ? visitorMessage.name
        : "Anonymous";
    }

    function getLastMessage(messages) {
      if (!messages.length) {
        return null;
      }

      return messages[messages.length - 1];
    }

    async function getSessionInfo(id) {
      try {
        const response =
          await fetch(
            `${WORKER}/messages?sessionId=${encodeURIComponent(id)}`,
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          return {
            name: "Anonymous",
            messages: []
          };
        }

        const messages =
          await response.json();

        return {
          name: getVisitorName(messages),
          messages: Array.isArray(messages)
            ? messages
            : []
        };

      } catch (error) {
        console.error(
          "getSessionInfo error:",
          error
        );

        return {
          name: "Anonymous",
          messages: []
        };
      }
    }

    function renderSessionList(sessions, names) {
      const oldScrollLeft =
        sessionList.scrollLeft;

      sessionList.innerHTML = "";

      if (!sessions.length) {
        sessionList.innerHTML =
          '<div class="empty-sessions">目前沒有聊天室</div>';

        return;
      }

      sessions.forEach(id => {
        const div =
          document.createElement("div");

        div.className = "session";

        if (id === currentSession) {
          div.classList.add("active");
        }

        if (newSessions.has(id)) {
          div.classList.add("has-new");
        }

        const displayName =
          names[id] || "Anonymous";

        div.innerHTML = `
          <div class="session-name">
            ${escapeHtml(displayName)}
          </div>

          <div class="session-id">
            ${escapeHtml(id)}
          </div>

          ${
            newSessions.has(id)
              ? '<span class="new-dot"></span>'
              : ""
          }
        `;

        div.addEventListener(
          "click",
          async () => {
            newSessions.delete(id);

            currentSession = id;

            renderSessionList(
              sessionsCache,
              sessionNames
            );

            updateChatHeader();

            await loadMessages(true);
          }
        );

        sessionList.appendChild(div);
      });

      sessionList.scrollLeft = oldScrollLeft;
    }

    let sessionNames = {};

    async function loadSessions() {
      try {
        const response =
          await fetch(
            `${WORKER}/sessions`,
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Sessions request failed: ${response.status}`
          );
        }

        const sessions =
          await response.json();

        if (!Array.isArray(sessions)) {
          throw new Error(
            "Invalid sessions response."
          );
        }

        sessionCount.textContent =
          `${sessions.length} sessions`;

        if (
          currentSession &&
          !sessions.includes(currentSession)
        ) {
          currentSession = null;
        }

        const sessionChanged =
          JSON.stringify(sessions) !==
          JSON.stringify(sessionsCache);

        if (!sessionChanged) {
          return;
        }

        sessionsCache = sessions;

        const newNames = {};

        await Promise.all(
          sessions.map(async id => {
            const info =
              await getSessionInfo(id);

            newNames[id] = info.name;

            const hash =
              getMessageHash(info.messages);

            if (
              messageHashes[id] &&
              messageHashes[id] !== hash &&
              id !== currentSession
            ) {
              const last =
                getLastMessage(info.messages);

              if (
                last &&
                last.role === "visitor"
              ) {
                newSessions.add(id);
              }
            }

            messageHashes[id] = hash;
          })
        );

        sessionNames = newNames;

        renderSessionList(
          sessions,
          sessionNames
        );

        if (
          !currentSession &&
          sessions.length > 0
        ) {
          currentSession = sessions[0];

          renderSessionList(
            sessions,
            sessionNames
          );

          updateChatHeader();

          await loadMessages(true);
        }

        if (!currentSession) {
          updateChatHeader();

          showEmptyMessages(
            "目前沒有任何聊天室"
          );
        }

      } catch (error) {
        console.error(
          "loadSessions error:",
          error
        );
      }
    }

    async function loadMessages(forceRender = false) {
      if (!currentSession) {
        showEmptyMessages(
          "請從左側選擇聊天室"
        );

        return;
      }

      if (isLoadingMessages) {
        return;
      }

      isLoadingMessages = true;

      try {
        const response =
          await fetch(
            `${WORKER}/messages?sessionId=${encodeURIComponent(
              currentSession
            )}`,
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Messages request failed: ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "Invalid messages response."
          );
        }

        const hash =
          getMessageHash(data);

        const oldHash =
          messageHashes[currentSession];

        if (
          !forceRender &&
          oldHash === hash
        ) {
          return;
        }

        const hadPreviousMessages =
          Boolean(oldHash);

        const lastMessage =
          getLastMessage(data);

        if (
          hadPreviousMessages &&
          oldHash !== hash &&
          lastMessage &&
          lastMessage.role === "visitor"
        ) {
          newSessions.add(currentSession);
        }

        messageHashes[currentSession] =
          hash;

        renderMessages(data);

        newSessions.delete(currentSession);

        renderSessionList(
          sessionsCache,
          sessionNames
        );

      } catch (error) {
        console.error(
          "loadMessages error:",
          error
        );
      } finally {
        isLoadingMessages = false;
      }
    }

    function renderMessages(data) {
      const shouldScroll =
        messagesBox.scrollHeight -
        messagesBox.scrollTop -
        messagesBox.clientHeight <
        120;

      messagesBox.innerHTML = "";

      if (!data.length) {
        showEmptyMessages(
          "這個聊天室目前沒有訊息"
        );

        return;
      }

      data.forEach(message => {
        const div =
          document.createElement("div");

        div.className =
          message.role === "admin"
            ? "message admin"
            : "message visitor";

        const name =
          message.role === "admin"
            ? "Kellan"
            : message.name || "Visitor";

        const time =
          message.time
            ? formatTime(message.time)
            : "";

        const messageHash =
          getMessageHash([message]);

        const isLatestVisitor =
          message.role === "visitor" &&
          message === data[data.length - 1];

        if (isLatestVisitor) {
          div.classList.add(
            "new-message"
          );
        }

        div.innerHTML = `
          <div class="message-name">
            ${escapeHtml(name)}
          </div>

          <div>
            ${escapeHtml(message.text || "")}
          </div>

          ${
            time
              ? `
                <div class="message-time">
                  ${time}
                </div>
              `
              : ""
          }
        `;

        messagesBox.appendChild(div);
      });

      if (
        shouldScroll ||
        data.length === 1
      ) {
        messagesBox.scrollTop =
          messagesBox.scrollHeight;
      }
    }

    async function reply() {
      if (!currentSession) {
        alert("請先選擇聊天室");
        return;
      }

      const text =
        textInput.value.trim();

      if (!text) {
        return;
      }

      sendButton.disabled = true;

      try {
        const response =
          await fetch(
            `${WORKER}/reply`,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                text,
                sessionId:
                  currentSession
              })
            }
          );

        if (!response.ok) {
          throw new Error(
            `Reply failed: ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!data || !data.ok) {
          throw new Error(
            data.error ||
            "Reply failed"
          );
        }

        textInput.value = "";

        await loadMessages(true);

        textInput.focus();

      } catch (error) {
        console.error(
          "reply error:",
          error
        );

        alert(
          "發送失敗，請稍後再試。"
        );

      } finally {
        sendButton.disabled = false;
      }
    }

    async function deleteCurrentSession() {
      if (!currentSession) {
        return;
      }

      const confirmed =
        confirm(
          "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
        );

      if (!confirmed) {
        return;
      }

      deleteButton.disabled = true;

      const deletedSession =
        currentSession;

      try {
        const response =
          await fetch(
            `${WORKER}/sessions?sessionId=${encodeURIComponent(
              deletedSession
            )}`,
            {
              method: "DELETE"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Delete failed: ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!data || !data.ok) {
          throw new Error(
            data.error ||
            "Delete failed"
          );
        }

        delete messageHashes[
          deletedSession
        ];

        delete sessionNames[
          deletedSession
        ];

        newSessions.delete(
          deletedSession
        );

        sessionsCache =
          sessionsCache.filter(
            id => id !== deletedSession
          );

        currentSession = null;

        messagesBox.innerHTML = `
          <div class="empty-messages">
            <div>
              <div
                style="
                  font-size:32px;
                  margin-bottom:10px;
                "
              >
                🗑
              </div>

              <div>
                聊天紀錄已刪除
              </div>
            </div>
          </div>
        `;

        renderSessionList(
          sessionsCache,
          sessionNames
        );

        updateChatHeader();

        await loadSessions();

      } catch (error) {
        console.error(
          "deleteCurrentSession error:",
          error
        );

        alert(
          "刪除失敗，請確認 Worker DELETE 功能已部署。"
        );

        deleteButton.disabled =
          !currentSession;
      }
    }

    function updateChatHeader() {
      if (!currentSession) {
        currentSessionName.textContent =
          "尚未選擇聊天室";

        currentSessionStatus.textContent =
          "Select a conversation";

        deleteButton.disabled = true;

        return;
      }

      currentSessionName.textContent =
        sessionNames[currentSession] ||
        "Anonymous";

      currentSessionStatus.textContent =
        currentSession;

      deleteButton.disabled = false;
    }

    function showEmptyMessages(text) {
      messagesBox.innerHTML = `
        <div class="empty-messages">
          <div>
            <div
              style="
                font-size:32px;
                margin-bottom:10px;
              "
            >
              💬
            </div>

            <div>
              ${escapeHtml(text)}
            </div>
          </div>
        </div>
      `;
    }

    sendButton.addEventListener(
      "click",
      reply
    );

    deleteButton.addEventListener(
      "click",
      deleteCurrentSession
    );

    textInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          reply();
        }
      }
    );

    async function refresh() {
      await loadSessions();

      if (currentSession) {
        await loadMessages(false);
      }
    }

    loadSessions();

    setInterval(
      refresh,
      2000
    );
  </script>

</body>
</html>
