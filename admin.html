<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室管理後台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #0b1328;
      color: #e5e7eb;
      overflow: hidden;
    }

    .topbar {
      height: 92px;
      padding: 0 38px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #0d172c;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .brand h1 {
      margin: 0;
      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
    }

    .brand p {
      margin: 7px 0 0;
      color: #7183a3;
      font-size: 14px;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 9px 16px;

      border: 1px solid rgba(34, 197, 94, 0.18);
      border-radius: 999px;

      background: rgba(34, 197, 94, 0.08);
      color: #4ade80;

      font-size: 13px;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #22c55e;

      box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
    }

    .dashboard {
      height: calc(100vh - 92px);

      display: flex;

      min-width: 0;
      min-height: 0;

      overflow: hidden;
    }

    .sidebar {
      width: 355px;
      min-width: 355px;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #0b1428;
      border-right: 1px solid rgba(148, 163, 184, 0.1);
    }

    .sidebar-header {
      padding: 22px 24px;

      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .sidebar-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sidebar-title strong {
      color: #f8fafc;
      font-size: 16px;
    }

    .session-count {
      padding: 6px 11px;

      border-radius: 999px;

      background: #17243d;
      color: #7890b5;

      font-size: 12px;
    }

    #sessionList {
      flex: 1;
      min-height: 0;

      padding: 12px;

      overflow-y: auto;
    }

    .session {
      width: 100%;

      padding: 13px 12px;

      border-radius: 10px;

      cursor: pointer;

      transition: 0.15s;
    }

    .session:hover {
      background: #121f38;
    }

    .session.active {
      background: #172a4a;
    }

    .session-name {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
    }

    .session-id {
      margin-top: 4px;

      color: #64748b;
      font-size: 11px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-sessions {
      padding: 30px 15px;

      text-align: center;

      color: #64748b;
      font-size: 13px;
    }

    .chat-panel {
      flex: 1;

      width: 0;
      min-width: 0;
      min-height: 0;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #0f172a;

      overflow: hidden;
    }

    .chat-header {
      flex: 0 0 auto;

      min-height: 86px;

      padding: 16px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .chat-user {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 14px;
    }

    .chat-avatar {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
      );

      color: #fff;

      font-size: 20px;
      font-weight: 700;
    }

    .chat-user > div:last-child {
      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    #currentSessionName {
      color: #f8fafc;

      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #currentSessionStatus {
      margin-top: 3px;

      color: #64748b;

      font-size: 12px;
    }

    .delete-button {
      height: 40px;

      padding: 0 14px;

      flex: 0 0 auto;

      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 9px;

      background: rgba(127, 29, 29, 0.12);

      color: #f87171;

      cursor: pointer;
    }

    .delete-button:hover:not(:disabled) {
      background: rgba(127, 29, 29, 0.25);
    }

    .delete-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #messages {
      flex: 1 1 auto;

      width: 100%;

      min-width: 0;
      min-height: 0;

      padding: 28px 30px;

      display: flex;
      flex-direction: column;

      gap: 16px;

      overflow-x: hidden;
      overflow-y: auto;
    }

    .message {
      width: 100%;
      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    .message.visitor {
      align-items: flex-start;
    }

    .message.admin {
      align-items: flex-end;
    }

    .message-name {
      margin-bottom: 5px;

      color: #64748b;

      font-size: 11px;
    }

    .message.admin .message-name {
      text-align: right;
    }

    .message > div:nth-child(2) {
      width: fit-content;

      max-width: min(720px, 75%);

      padding: 13px 17px;

      border-radius: 12px;

      line-height: 1.65;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.visitor > div:nth-child(2) {
      background: #172554;

      color: #e2e8f0;

      border: 1px solid rgba(59, 130, 246, 0.16);

      border-top-left-radius: 5px;
    }

    .message.admin > div:nth-child(2) {
      background: #2563eb;

      color: #fff;

      border: 1px solid rgba(96, 165, 250, 0.18);

      border-top-right-radius: 5px;
    }

    .message-time {
      margin-top: 5px;

      color: #475569;

      font-size: 10px;
    }

    .message.admin .message-time {
      text-align: right;
    }

    .empty-messages {
      flex: 1;

      width: 100%;
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #64748b;

      text-align: center;
    }

    .composer {
      flex: 0 0 auto;

      width: 100%;

      padding: 16px 22px;

      display: flex;
      align-items: center;

      gap: 10px;

      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }

    #text {
      flex: 1;

      width: 100%;
      min-width: 0;

      height: 46px;

      padding: 0 15px;

      border: 1px solid #263653;
      border-radius: 10px;

      outline: none;

      background: #111c33;
      color: #e2e8f0;

      font-size: 14px;
    }

    #text:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    #text::placeholder {
      color: #64748b;
    }

    .send-button {
      height: 46px;

      padding: 0 20px;

      flex: 0 0 auto;

      border: 0;
      border-radius: 10px;

      background: #2563eb;

      color: #fff;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .send-button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 800px) {

      .topbar {
        height: 76px;
        padding: 0 18px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .brand p {
        font-size: 11px;
      }

      .dashboard {
        height: calc(100vh - 76px);
      }

      .sidebar {
        width: 280px;
        min-width: 280px;
      }

      #messages {
        padding: 20px 16px;
      }

      .message > div:nth-child(2) {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="brand">

      <h1>聊天室管理後台</h1>

      <p>
        Chat Administration · Kellan Resume Assistant
      </p>

    </div>

    <div class="online-status">

      <span class="online-dot"></span>

      System Online

    </div>

  </header>

  <section class="dashboard">

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-title">

          <strong>
            聊天室列表
          </strong>

          <span
            id="sessionCount"
            class="session-count"
          >
            0 sessions
          </span>

        </div>

      </div>

      <div id="sessionList"></div>

    </aside>

    <section class="chat-panel">

      <header class="chat-header">

        <div class="chat-user">

          <div class="chat-avatar">
            K
          </div>

          <div>

            <strong id="currentSessionName">
              尚未選擇聊天室
            </strong>

            <span id="currentSessionStatus">
              Select a conversation
            </span>

          </div>

        </div>

        <button
          id="deleteButton"
          class="delete-button"
          type="button"
          disabled
        >
          🗑 刪除紀錄
        </button>

      </header>

      <div id="messages">

        <div class="empty-messages">

          <div>

            <div
              style="
                font-size:32px;
                margin-bottom:10px;
              "
            >
              💬
            </div>

            <div>
              請從左側選擇聊天室
            </div>

          </div>

        </div>

      </div>

      <div class="composer">

        <input
          id="text"
          type="text"
          placeholder="輸入回覆後按 Enter..."
          autocomplete="off"
        />

        <button
          id="sendButton"
          class="send-button"
          type="button"
        >
          發送
        </button>

      </div>

    </section>

  </section>
  
  <script>
  const WORKER =
    "https://hung.kaekae939311.workers.dev";
  
  let currentSession = null;
  
  const sessionList =
    document.getElementById("sessionList");
  
  const sessionCount =
    document.getElementById("sessionCount");
  
  const messagesBox =
    document.getElementById("messages");
  
  const textInput =
    document.getElementById("text");
  
  const sendButton =
    document.getElementById("sendButton");
  
  const deleteButton =
    document.getElementById("deleteButton");
  
  const currentSessionName =
    document.getElementById("currentSessionName");
  
  const currentSessionStatus =
    document.getElementById("currentSessionStatus");
  
  let sessionCache = new Map();
  
  let messageCache = new Map();
  
  async function loadSessions() {
    try {
      const res =
        await fetch(
          `${WORKER}/sessions`,
          {
            cache: "no-store"
          }
        );
  
      if (!res.ok) {
        throw new Error(
          `Sessions request failed: ${res.status}`
        );
      }
  
      const sessions =
        await res.json();
  
      sessionCount.textContent =
        `${sessions.length} sessions`;
  
      if (!Array.isArray(sessions)) {
        return;
      }
  
      if (
        currentSession &&
        !sessions.includes(currentSession)
      ) {
        currentSession = null;
        updateChatHeader();
        showEmptyMessages(
          "目前聊天室已被刪除"
        );
      }
  
      const sessionData =
        await Promise.all(
          sessions.map(async id => {
            let displayName = "Anonymous";
            let messages = [];
  
            try {
              const messageRes =
                await fetch(
                  `${WORKER}/messages?sessionId=${encodeURIComponent(id)}`,
                  {
                    cache: "no-store"
                  }
                );
  
              if (messageRes.ok) {
                const data =
                  await messageRes.json();
  
                if (Array.isArray(data)) {
                  messages = data;
  
                  const visitorMessage =
                    data.find(
                      message =>
                        message.role === "visitor" &&
                        message.name
                    );
  
                  if (visitorMessage) {
                    displayName =
                      visitorMessage.name;
                  }
                }
              }
            } catch (error) {
              console.error(
                "load session data error:",
                error
              );
            }
  
            return {
              id,
              displayName,
              messages
            };
          })
        );
  
      const newCache = new Map();
  
      sessionData.forEach(item => {
        newCache.set(
          item.id,
          item
        );
      });
  
      sessionCache = newCache;
  
      updateSessionList(
        sessions,
        sessionData
      );
  
      if (
        currentSession &&
        sessionCache.has(currentSession)
      ) {
        const current =
          sessionCache.get(currentSession);
  
        messageCache.set(
          currentSession,
          current.messages
        );
      }
  
      if (!currentSession && sessions.length) {
        currentSession = sessions[0];
  
        updateSessionActiveState();
  
        updateChatHeader();
  
        await loadMessages();
      }
    } catch (error) {
      console.error(
        "loadSessions error:",
        error
      );
    }
  }
  
  function updateSessionList(
    sessions,
    sessionData
  ) {
    const existing =
      new Map();
  
    sessionList
      .querySelectorAll(".session")
      .forEach(element => {
        existing.set(
          element.dataset.sessionId,
          element
        );
      });
  
    sessions.forEach(
      (id, index) => {
        const data =
          sessionData.find(
            item => item.id === id
          );
  
        if (!data) {
          return;
        }
  
        let div =
          existing.get(id);
  
        if (!div) {
          div =
            document.createElement("div");
  
          div.className =
            "session";
  
          div.dataset.sessionId =
            id;
  
          div.addEventListener(
            "click",
            async () => {
              currentSession = id;
  
              updateSessionActiveState();
  
              updateChatHeader();
  
              await loadMessages();
            }
          );
        }
  
        const lastMessage =
          data.messages.length
            ? data.messages[
                data.messages.length - 1
              ]
            : null;
  
        const isUnread =
          id !== currentSession &&
          lastMessage &&
          lastMessage.role === "visitor";
  
        let nameElement =
          div.querySelector(
            ".session-name"
          );
  
        if (!nameElement) {
          nameElement =
            document.createElement("div");
  
          nameElement.className =
            "session-name";
  
          div.appendChild(
            nameElement
          );
        }
  
        nameElement.textContent =
          data.displayName;
  
        let idElement =
          div.querySelector(
            ".session-id"
          );
  
        if (!idElement) {
          idElement =
            document.createElement("div");
  
          idElement.className =
            "session-id";
  
          div.appendChild(
            idElement
          );
        }
  
        idElement.textContent =
          id;
  
        let unread =
          div.querySelector(
            ".session-unread"
          );
  
        if (isUnread) {
          if (!unread) {
            unread =
              document.createElement("span");
  
            unread.className =
              "session-unread";
  
            unread.style.display =
              "inline-block";
  
            unread.style.width =
              "9px";
  
            unread.style.height =
              "9px";
  
            unread.style.marginLeft =
              "8px";
  
            unread.style.borderRadius =
              "50%";
  
            unread.style.background =
              "#22c55e";
  
            unread.style.boxShadow =
              "0 0 8px rgba(34,197,94,.8)";
  
            nameElement.appendChild(
              unread
            );
          }
        } else if (unread) {
          unread.remove();
        }
  
        if (
          id === currentSession
        ) {
          div.classList.add(
            "active"
          );
        } else {
          div.classList.remove(
            "active"
          );
        }
  
        const currentAtPosition =
          sessionList.children[index];
  
        if (
          currentAtPosition !== div
        ) {
          sessionList.insertBefore(
            div,
            currentAtPosition || null
          );
        }
      });
  
    const validIds =
      new Set(sessions);
  
    sessionList
      .querySelectorAll(".session")
      .forEach(element => {
        if (
          !validIds.has(
            element.dataset.sessionId
          )
        ) {
          element.remove();
        }
      });
  }
  
  function updateSessionActiveState() {
    sessionList
      .querySelectorAll(".session")
      .forEach(element => {
        if (
          element.dataset.sessionId ===
          currentSession
        ) {
          element.classList.add(
            "active"
          );
        } else {
          element.classList.remove(
            "active"
          );
        }
      });
  
    if (currentSession) {
      const active =
        sessionList.querySelector(
          `[data-session-id="${CSS.escape(
            currentSession
          )}"]`
        );
  
      if (active) {
        const unread =
          active.querySelector(
            ".session-unread"
          );
  
        if (unread) {
          unread.remove();
        }
      }
    }
  }
  
  async function loadMessages() {
    if (!currentSession) {
      showEmptyMessages(
        "請從左側選擇聊天室"
      );
      return;
    }
  
    try {
      const res =
        await fetch(
          `${WORKER}/messages?sessionId=${encodeURIComponent(
            currentSession
          )}`,
          {
            cache: "no-store"
          }
        );
  
      if (!res.ok) {
        throw new Error(
          `Messages request failed: ${res.status}`
        );
      }
  
      const data =
        await res.json();
  
      if (!Array.isArray(data)) {
        return;
      }
  
      messageCache.set(
        currentSession,
        data
      );
  
      renderMessages(data);
  
      markCurrentSessionRead();
    } catch (error) {
      console.error(
        "loadMessages error:",
        error
      );
    }
  }
  
  function renderMessages(data) {
    messagesBox.innerHTML = "";
  
    if (!data.length) {
      showEmptyMessages(
        "這個聊天室目前沒有訊息"
      );
      return;
    }
  
    data.forEach(message => {
      const div =
        document.createElement("div");
  
      div.className =
        message.role === "admin"
          ? "message admin"
          : "message visitor";
  
      const name =
        message.role === "admin"
          ? "Kellan"
          : (
              message.name ||
              "Visitor"
            );
  
      const time =
        message.time
          ? formatTime(
              message.time
            )
          : "";
  
      div.innerHTML = `
        <div class="message-name">
          ${escapeHtml(name)}
        </div>
  
        <div>
          ${escapeHtml(
            message.text || ""
          )}
        </div>
  
        ${
          time
            ? `
              <div class="message-time">
                ${time}
              </div>
            `
            : ""
        }
      `;
  
      messagesBox.appendChild(
        div
      );
    });
  
    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  }
  
  function markCurrentSessionRead() {
    if (!currentSession) {
      return;
    }
  
    const active =
      sessionList.querySelector(
        `[data-session-id="${CSS.escape(
          currentSession
        )}"]`
      );
  
    if (!active) {
      return;
    }
  
    const unread =
      active.querySelector(
        ".session-unread"
      );
  
    if (unread) {
      unread.remove();
    }
  }
  
  async function reply() {
    if (!currentSession) {
      alert(
        "請先選擇聊天室"
      );
      return;
    }
  
    const text =
      textInput.value.trim();
  
    if (!text) {
      return;
    }
  
    sendButton.disabled =
      true;
  
    try {
      const res =
        await fetch(
          `${WORKER}/reply`,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              text,
              sessionId:
                currentSession
            })
          }
        );
  
      if (!res.ok) {
        throw new Error(
          `Reply failed: ${res.status}`
        );
      }
  
      const data =
        await res.json();
  
      if (!data.ok) {
        throw new Error(
          data.error ||
          "Reply failed"
        );
      }
  
      textInput.value = "";
  
      await loadMessages();
  
      await loadSessions();
  
      textInput.focus();
    } catch (error) {
      console.error(
        "reply error:",
        error
      );
  
      alert(
        "發送失敗，請稍後再試。"
      );
    } finally {
      sendButton.disabled =
        false;
    }
  }
  
  async function deleteCurrentSession() {
    if (!currentSession) {
      return;
    }
  
    const confirmed =
      confirm(
        "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
      );
  
    if (!confirmed) {
      return;
    }
  
    deleteButton.disabled =
      true;
  
    const deletedSession =
      currentSession;
  
    try {
      const res =
        await fetch(
          `${WORKER}/sessions?sessionId=${encodeURIComponent(
            deletedSession
          )}`,
          {
            method: "DELETE"
          }
        );
  
      if (!res.ok) {
        throw new Error(
          `Delete failed: ${res.status}`
        );
      }
  
      const data =
        await res.json();
  
      if (!data.ok) {
        throw new Error(
          data.error ||
          "Delete failed"
        );
      }
  
      sessionCache.delete(
        deletedSession
      );
  
      messageCache.delete(
        deletedSession
      );
  
      currentSession =
        null;
  
      messagesBox.innerHTML = `
        <div class="empty-messages">
          <div>
            <div
              style="
                font-size:32px;
                margin-bottom:10px;
              "
            >
              🗑
            </div>
  
            <div>
              聊天紀錄已刪除
            </div>
          </div>
        </div>
      `;
  
      updateChatHeader();
  
      await loadSessions();
    } catch (error) {
      console.error(
        "deleteCurrentSession error:",
        error
      );
  
      alert(
        "刪除失敗，請確認 Worker DELETE 功能已部署。"
      );
    } finally {
      deleteButton.disabled =
        !currentSession;
    }
  }
  
  function updateChatHeader() {
    if (!currentSession) {
      currentSessionName.textContent =
        "尚未選擇聊天室";
  
      currentSessionStatus.textContent =
        "Select a conversation";
  
      deleteButton.disabled =
        true;
  
      return;
    }
  
    const data =
      sessionCache.get(
        currentSession
      );
  
    currentSessionName.textContent =
      data
        ? data.displayName
        : "聊天室";
  
    currentSessionStatus.textContent =
      currentSession;
  
    deleteButton.disabled =
      false;
  }
  
  function showEmptyMessages(text) {
    messagesBox.innerHTML = `
      <div class="empty-messages">
        <div>
          <div
            style="
              font-size:32px;
              margin-bottom:10px;
            "
          >
            💬
          </div>
  
          <div>
            ${escapeHtml(text)}
          </div>
        </div>
      </div>
    `;
  }
  
  function formatTime(timestamp) {
    const date =
      new Date(timestamp);
  
    return date.toLocaleString(
      "zh-TW",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }
  
  function escapeHtml(value) {
    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }
  
  sendButton.addEventListener(
    "click",
    reply
  );
  
  deleteButton.addEventListener(
    "click",
    deleteCurrentSession
  );
  
  textInput.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        reply();
      }
    }
  );
  
  async function refreshChat() {
    if (!currentSession) {
      await loadSessions();
      return;
    }
  
    await loadMessages();
    await loadSessions();
  
    updateSessionActiveState();
    updateChatHeader();
  }
  
  loadSessions();
  
  setInterval(
    refreshChat,
    2000
  );
  </script>

</body>
</html>
