<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室管理後台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #0b1328;
      color: #e5e7eb;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      width: 100%;
      height: 92px;
      padding: 0 38px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #0d172c;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;

      color: #f8fafc;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
    }

    .brand p {
      margin: 7px 0 0;

      color: #7183a3;
      font-size: 14px;
      line-height: 1.4;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 9px 16px;

      border: 1px solid rgba(34, 197, 94, 0.18);
      border-radius: 999px;

      background: rgba(34, 197, 94, 0.08);
      color: #4ade80;

      font-size: 13px;
      white-space: nowrap;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #22c55e;

      box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
    }

    .dashboard {
      width: 100%;
      height: calc(100vh - 92px);

      display: flex;

      min-width: 0;
      min-height: 0;

      overflow: hidden;
    }

    .sidebar {
      width: 355px;
      min-width: 355px;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #0b1428;
      border-right: 1px solid rgba(148, 163, 184, 0.1);

      overflow: hidden;
    }

    .sidebar-header {
      flex: 0 0 auto;

      padding: 22px 24px;

      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .sidebar-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sidebar-title strong {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 700;
    }

    .session-count {
      flex: 0 0 auto;

      padding: 6px 11px;

      border-radius: 999px;

      background: #17243d;
      color: #7890b5;

      font-size: 12px;
      white-space: nowrap;
    }

    #sessionList {
      flex: 1 1 auto;

      min-height: 0;

      padding: 12px;

      overflow-x: hidden;
      overflow-y: auto;
    }

    #sessionList::-webkit-scrollbar {
      width: 6px;
    }

    #sessionList::-webkit-scrollbar-track {
      background: transparent;
    }

    #sessionList::-webkit-scrollbar-thumb {
      background: #243554;
      border-radius: 10px;
    }

    .chat-panel {
      flex: 1 1 auto;

      width: 0;
      min-width: 0;
      min-height: 0;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #0f172a;

      overflow: hidden;
    }

    .chat-header {
      flex: 0 0 auto;

      min-height: 86px;

      padding: 16px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .chat-user {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-avatar {
      flex: 0 0 46px;

      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
      );

      color: #ffffff;

      font-size: 20px;
      font-weight: 700;
    }

    .chat-user > div:last-child {
      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    #currentSessionName {
      color: #f8fafc;

      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #currentSessionStatus {
      margin-top: 3px;

      color: #64748b;

      font-size: 12px;
      line-height: 1.4;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-button {
      flex: 0 0 auto;

      height: 40px;

      padding: 0 14px;

      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 9px;

      background: rgba(127, 29, 29, 0.12);
      color: #f87171;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .delete-button:hover:not(:disabled) {
      background: rgba(127, 29, 29, 0.25);
      border-color: rgba(248, 113, 113, 0.35);
    }

    .delete-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #messages {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      min-height: 0;

      padding: 28px 30px;

      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;

      overflow-x: hidden;
      overflow-y: auto;

      background: #0f172a;
    }

    #messages::-webkit-scrollbar {
      width: 7px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #263653;
      border-radius: 10px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: #334766;
    }

    #messages .message {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      display: flex;

      box-sizing: border-box;
    }

    #messages .message.user {
      justify-content: flex-end;
    }

    #messages .message.assistant {
      justify-content: flex-start;
    }

    #messages .message-bubble {
      width: fit-content;
      max-width: min(720px, 75%);
      min-width: 0;

      padding: 13px 17px;

      border-radius: 12px;

      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;

      box-sizing: border-box;
    }

    #messages .message.assistant .message-bubble {
      background: #172554;
      color: #e2e8f0;

      border: 1px solid rgba(59, 130, 246, 0.16);

      border-top-left-radius: 5px;
    }

    #messages .message.user .message-bubble {
      background: #2563eb;
      color: #ffffff;

      border: 1px solid rgba(96, 165, 250, 0.18);

      border-top-right-radius: 5px;
    }

    #messages .message p {
      margin: 0;

      max-width: 100%;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .empty-messages {
      flex: 1 1 auto;

      width: 100%;
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #64748b;

      text-align: center;
    }

    .empty-messages > div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .composer {
      flex: 0 0 auto;

      width: 100%;
      min-width: 0;

      padding: 16px 22px;

      display: flex;
      align-items: center;
      gap: 10px;

      border-top: 1px solid rgba(148, 163, 184, 0.1);

      background: #0f172a;
    }

    #text {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      height: 46px;

      padding: 0 15px;

      border: 1px solid #263653;
      border-radius: 10px;

      outline: none;

      background: #111c33;
      color: #e2e8f0;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #text::placeholder {
      color: #64748b;
    }

    #text:focus {
      border-color: #3b82f6;

      box-shadow:
        0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .send-button {
      flex: 0 0 auto;

      height: 46px;

      padding: 0 20px;

      border: 0;
      border-radius: 10px;

      background: #2563eb;
      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: background 0.2s ease;
    }

    .send-button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 290px;
        min-width: 290px;
      }

      #messages {
        padding: 22px 20px;
      }

      #messages .message-bubble {
        max-width: 82%;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        height: 76px;
        padding: 0 18px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .brand p {
        font-size: 11px;
      }

      .online-status {
        padding: 7px 10px;
        font-size: 11px;
      }

      .dashboard {
        height: calc(100vh - 76px);
      }

      .sidebar {
        width: 240px;
        min-width: 240px;
      }

      .chat-header {
        padding: 12px 16px;
      }

      .delete-button {
        padding: 0 10px;
        font-size: 12px;
      }

      #messages {
        padding: 18px 14px;
      }

      #messages .message-bubble {
        max-width: 88%;
      }

      .composer {
        padding: 12px 14px;
      }

      .send-button {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <h1>聊天室管理後台</h1>
      <p>Chat Administration · Kellan Resume Assistant</p>
    </div>

    <div class="online-status">
      <span class="online-dot"></span>
      System Online
    </div>

  </header>

  <section class="dashboard">

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-title">
          <strong>聊天室列表</strong>

          <span
            id="sessionCount"
            class="session-count"
          >
            0 sessions
          </span>
        </div>

      </div>

      <div id="sessionList"></div>

    </aside>

    <section class="chat-panel">

      <header class="chat-header">

        <div class="chat-user">

          <div class="chat-avatar">
            K
          </div>

          <div>

            <strong id="currentSessionName">
              尚未選擇聊天室
            </strong>

            <span id="currentSessionStatus">
              Select a conversation
            </span>

          </div>

        </div>

        <button
          id="deleteButton"
          class="delete-button"
          type="button"
          disabled
        >
          🗑 刪除紀錄
        </button>

      </header>

      <div id="messages">

        <div class="empty-messages">

          <div>

            <div
              style="
                font-size: 32px;
                margin-bottom: 10px;
              "
            >
              💬
            </div>

            <div>
              請從左側選擇聊天室
            </div>

          </div>

        </div>

      </div>

      <div class="composer">

        <input
          id="text"
          type="text"
          placeholder="輸入回覆後按 Enter..."
          autocomplete="off"
        />

        <button
          id="sendButton"
          class="send-button"
          type="button"
        >
          發送
        </button>

      </div>

    </section>

  </section>

<script>
const API = window.API || "";

let sessions = [];
let currentSessionId = null;

const sessionList = document.getElementById("sessionList");
const sessionCount = document.getElementById("sessionCount");
const messages = document.getElementById("messages");
const text = document.getElementById("text");
const sendButton = document.getElementById("sendButton");
const deleteButton = document.getElementById("deleteButton");
const currentSessionName = document.getElementById("currentSessionName");
const currentSessionStatus = document.getElementById("currentSessionStatus");

async function loadSessions() {
  try {
    const response = await fetch(`${API}/sessions`);
    const data = await response.json();

    sessions = Array.isArray(data) ? data : [];

    sessionCount.textContent = `${sessions.length} sessions`;

    renderSessions();
  } catch (error) {
    console.error("Failed to load sessions:", error);
  }
}

function renderSessions() {
  sessionList.innerHTML = "";

  if (!sessions.length) {
    sessionList.innerHTML = `
      <div style="
        padding: 30px 15px;
        text-align: center;
        color: #64748b;
        font-size: 13px;
      ">
        尚無聊天室
      </div>
    `;

    return;
  }

  sessions.forEach((sessionId) => {
    const item = document.createElement("div");

    item.className = "session-item";

    if (sessionId === currentSessionId) {
      item.classList.add("active");
    }

    item.innerHTML = `
      <div class="session-item-avatar">
        K
      </div>

      <div class="session-item-content">
        <strong>${escapeHtml(sessionId)}</strong>
        <span>Chat session</span>
      </div>
    `;

    item.addEventListener("click", () => {
      selectSession(sessionId);
    });

    sessionList.appendChild(item);
  });
}

async function selectSession(sessionId) {
  currentSessionId = sessionId;

  currentSessionName.textContent = sessionId;
  currentSessionStatus.textContent = "Conversation active";

  deleteButton.disabled = false;

  renderSessions();

  await loadMessages(sessionId);
}

async function loadMessages(sessionId) {
  try {
    const response = await fetch(
      `${API}/messages?sessionId=${encodeURIComponent(sessionId)}`
    );

    const data = await response.json();

    renderMessages(Array.isArray(data) ? data : []);
  } catch (error) {
    console.error("Failed to load messages:", error);
  }
}

function renderMessages(data) {
  messages.innerHTML = "";

  if (!data.length) {
    messages.innerHTML = `
      <div class="empty-messages">
        <div>
          <div style="
            font-size: 32px;
            margin-bottom: 10px;
          ">
            💬
          </div>

          <div>
            尚無訊息
          </div>
        </div>
      </div>
    `;

    return;
  }

  data.forEach((message) => {
    const wrapper = document.createElement("div");

    wrapper.className = "message";

    const role = message.role === "admin"
      ? "admin"
      : "visitor";

    wrapper.classList.add(role);

    const bubble = document.createElement("div");

    bubble.className = "message-bubble";

    const name = message.name
      ? `<div style="
          font-size: 11px;
          opacity: .6;
          margin-bottom: 5px;
        ">${escapeHtml(message.name)}</div>`
      : "";

    bubble.innerHTML = `
      ${name}
      <div>${escapeHtml(message.text || "")}</div>
    `;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);
  });

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const value = text.value.trim();

  if (!value || !currentSessionId) {
    return;
  }

  sendButton.disabled = true;

  try {
    const response = await fetch(`${API}/reply`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: value,
        sessionId: currentSessionId
      })
    });

    const result = await response.json();

    if (!result.ok) {
      throw new Error(
        result.error || "Reply failed"
      );
    }

    text.value = "";

    await loadMessages(currentSessionId);
  } catch (error) {
    console.error("Failed to send message:", error);
    alert("發送失敗");
  } finally {
    sendButton.disabled = false;
    text.focus();
  }
}

async function deleteCurrentSession() {
  if (!currentSessionId) {
    return;
  }

  const confirmed = confirm(
    "確定要刪除這個聊天室的所有紀錄嗎？"
  );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled = true;

  try {
    const response = await fetch(
      `${API}/sessions?sessionId=${encodeURIComponent(currentSessionId)}`,
      {
        method: "DELETE"
      }
    );

    const result = await response.json();

    if (!result.ok) {
      throw new Error(
        result.error || "Delete failed"
      );
    }

    sessions = sessions.filter(
      (id) => id !== currentSessionId
    );

    currentSessionId = null;

    currentSessionName.textContent =
      "尚未選擇聊天室";

    currentSessionStatus.textContent =
      "Select a conversation";

    messages.innerHTML = `
      <div class="empty-messages">
        <div>
          <div style="
            font-size: 32px;
            margin-bottom: 10px;
          ">
            💬
          </div>

          <div>
            請從左側選擇聊天室
          </div>
        </div>
      </div>
    `;

    sessionCount.textContent =
      `${sessions.length} sessions`;

    renderSessions();
  } catch (error) {
    console.error("Failed to delete session:", error);

    alert("刪除失敗");

    deleteButton.disabled = false;
  }
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value;
  return div.innerHTML;
}

sendButton.addEventListener(
  "click",
  sendMessage
);

deleteButton.addEventListener(
  "click",
  deleteCurrentSession
);

text.addEventListener(
  "keydown",
  (event) => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);

loadSessions();

setInterval(() => {
  loadSessions();

  if (currentSessionId) {
    loadMessages(currentSessionId);
  }
}, 5000);
</script>

  
</body>
</html>
