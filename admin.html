<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>聊天室管理</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    #messages {
      border: 1px solid #ccc;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }

    .visitor { color: #2563eb; margin: 6px 0; }
    .admin { color: #16a34a; margin: 6px 0; }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>網站聊天室管理</h2>

  <div id="messages"></div>

  <input id="text" placeholder="輸入回覆...">

  <script>
    const WORKER = "https://hung.kaekae939311.workers.dev";

    async function load() {
      const res = await fetch(`${WORKER}/messages`);
      const data = await res.json();

      const box = document.getElementById("messages");
      box.innerHTML = "";

      data.forEach(m => {
        const div = document.createElement("div");
        div.className = m.role;
        div.textContent = `${m.role}: ${m.text}`;
        box.appendChild(div);
      });

      box.scrollTop = box.scrollHeight;
    }

    async function reply() {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!text) return;

      await fetch(`${WORKER}/reply`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
      });

      input.value = "";
      load();
    }

    document.getElementById("text").addEventListener("keydown", e => {
      if (e.key === "Enter") reply();
    });

    setInterval(load, 2000);
    load();
  </script>
</body>
</html>
