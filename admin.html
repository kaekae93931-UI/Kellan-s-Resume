<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室管理後台</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;
  background: #f4f7f8;
  color: #172126;
  overflow: hidden;
}

button,
input {
  font: inherit;
}

.topbar {
  height: 72px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #ffffff;
  border-bottom: 1px solid #e2e8ea;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}

.brand p {
  margin: 4px 0 0;
  color: #7b898f;
  font-size: 12px;
}

.online-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #53636a;
  font-size: 13px;
}

.online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 4px rgba(34,197,94,.12);
}

.dashboard {
  height: calc(100vh - 72px);
  display: flex;
  min-height: 0;
}

.sidebar {
  width: 310px;
  flex: 0 0 310px;
  background: #ffffff;
  border-right: 1px solid #e2e8ea;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid #edf1f2;
}

.sidebar-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.sidebar-title strong {
  font-size: 15px;
}

.session-count {
  color: #87949a;
  font-size: 12px;
}

#sessionList {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.session {
  padding: 13px 14px;
  margin-bottom: 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s ease;
}

.session:hover {
  background: #f1f5f6;
}

.session.active {
  background: #e9f7ef;
}

.session-name {
  font-size: 14px;
  font-weight: 600;
  color: #1c292e;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-id {
  margin-top: 4px;
  color: #91a0a6;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty-sessions {
  padding: 30px 15px;
  text-align: center;
  color: #96a2a7;
  font-size: 13px;
}

.chat-panel {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #f8fafb;
}

.chat-header {
  height: 72px;
  flex: 0 0 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: #ffffff;
  border-bottom: 1px solid #e2e8ea;
}

.chat-user {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #172126;
  color: #ffffff;
  font-weight: 700;
}

.chat-user strong {
  display: block;
  font-size: 14px;
}

.chat-user span {
  display: block;
  margin-top: 3px;
  color: #89969b;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.delete-button {
  flex: 0 0 auto;
  border: 1px solid #f0caca;
  background: #fff5f5;
  color: #d64545;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}

.delete-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 28px;
  display: flex;
  flex-direction: column;
}

.empty-messages {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #9aa6aa;
  font-size: 13px;
}

.message {
  width: fit-content;
  max-width: min(68%, 560px);
  min-width: 0;
  padding: 8px 12px;
  margin-bottom: 8px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.message.visitor {
  align-self: flex-start;
  margin-right: auto;
  background: #ffffff;
  border: 1px solid #e1e7e9;
  color: #26343a;
  border-bottom-left-radius: 5px;
}

.message.admin {
  align-self: flex-end;
  margin-left: auto;
  background: #dff7e8;
  border: 1px solid #c7ecd5;
  color: #173a25;
  border-bottom-right-radius: 5px;
}

.message-name {
  margin-bottom: 3px;
  font-size: 10px;
  line-height: 1.2;
  font-weight: 600;
  opacity: .62;
}

.message-text {
  max-width: 100%;
  padding: 0;
  margin: 0;
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.message-time {
  margin-top: 4px;
  font-size: 9px;
  line-height: 1.2;
  opacity: .5;
}

.message.new-message {
  animation: newMessage .5s ease;
}

@keyframes newMessage {
  0% {
    box-shadow: 0 0 0 5px rgba(34,197,94,.18);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(34,197,94,0);
  }
}

.composer {
  flex: 0 0 auto;
  padding: 14px 20px;
  display: flex;
  gap: 10px;
  background: #ffffff;
  border-top: 1px solid #e2e8ea;
}

#text {
  flex: 1;
  min-width: 0;
  height: 42px;
  padding: 0 13px;
  border: 1px solid #dce4e6;
  border-radius: 9px;
  outline: none;
  background: #f9fbfb;
}

#text:focus {
  border-color: #9db8aa;
  background: #ffffff;
}

.send-button {
  width: 72px;
  height: 42px;
  border: 0;
  border-radius: 9px;
  background: #172126;
  color: #ffffff;
  cursor: pointer;
}

.send-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

@media (max-width: 768px) {
  body {
    overflow: hidden;
  }

  .topbar {
    height: 58px;
    padding: 0 14px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .brand p {
    display: none;
  }

  .online-status {
    font-size: 11px;
  }

  .dashboard {
    height: calc(100vh - 58px);
  }

  .sidebar {
    width: 92px;
    flex: 0 0 92px;
  }

  .sidebar-header {
    padding: 12px 8px;
  }

  .sidebar-title {
    display: block;
    text-align: center;
  }

  .sidebar-title strong {
    display: block;
    font-size: 12px;
  }

  .session-count {
    display: block;
    margin-top: 4px;
    font-size: 9px;
  }

  #sessionList {
    padding: 5px;
  }

  .session {
    padding: 10px 6px;
    border-radius: 8px;
    text-align: center;
  }

  .session-name {
    font-size: 11px;
  }

  .session-id {
    margin-top: 3px;
    font-size: 8px;
  }

  .chat-header {
    height: 60px;
    flex-basis: 60px;
    padding: 0 10px;
    gap: 8px;
  }

  .chat-avatar {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
    font-size: 13px;
  }

  .chat-user {
    gap: 8px;
    min-width: 0;
  }

  .chat-user strong {
    font-size: 12px;
  }

  .chat-user span {
    max-width: 150px;
    font-size: 9px;
  }

  .delete-button {
    padding: 6px 8px;
    font-size: 10px;
  }

  #messages {
    padding: 14px 10px;
  }

  .message {
    max-width: 78%;
    padding: 7px 10px;
    margin-bottom: 7px;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.4;
  }

  .message.visitor {
    border-bottom-left-radius: 5px;
  }

  .message.admin {
    border-bottom-right-radius: 5px;
  }

  .message-name {
    font-size: 9px;
    margin-bottom: 2px;
  }

  .message-text {
    font-size: 13px;
    line-height: 1.4;
  }

  .message-time {
    font-size: 8px;
    margin-top: 3px;
  }

  .composer {
    padding: 8px;
    gap: 6px;
  }

  #text {
    height: 38px;
    padding: 0 10px;
    font-size: 13px;
  }

  .send-button {
    width: 54px;
    height: 38px;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .sidebar {
    width: 82px;
    flex-basis: 82px;
  }

  .online-status {
    font-size: 0;
  }

  .online-dot {
    width: 7px;
    height: 7px;
  }

  .chat-header {
    padding: 0 8px;
  }

  .delete-button {
    max-width: 76px;
    white-space: nowrap;
    overflow: hidden;
  }

  #messages {
    padding: 12px 8px;
  }

  .message {
    max-width: 82%;
    padding: 7px 9px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <h1>聊天室管理後台</h1>
    <p>Chat Administration · Kellan Resume Assistant</p>
  </div>

  <div class="online-status">
    <span class="online-dot"></span>
    System Online
  </div>
</header>

<section class="dashboard">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-title">
        <strong>聊天室列表</strong>

        <span
          id="sessionCount"
          class="session-count"
        >
          0 sessions
        </span>
      </div>
    </div>

    <div id="sessionList"></div>

  </aside>

  <section class="chat-panel">

    <header class="chat-header">

      <div class="chat-user">

        <div class="chat-avatar">
          K
        </div>

        <div>
          <strong id="currentSessionName">
            尚未選擇聊天室
          </strong>

          <span id="currentSessionStatus">
            Select a conversation
          </span>
        </div>

      </div>

      <button
        id="deleteButton"
        class="delete-button"
        type="button"
        disabled
      >
        🗑 刪除紀錄
      </button>

    </header>

    <div id="messages">

      <div class="empty-messages">
        <div>

          <div
            style="
              font-size:32px;
              margin-bottom:10px;
            "
          >
            💬
          </div>

          <div>
            請從左側選擇聊天室
          </div>

        </div>
      </div>

    </div>

    <div class="composer">

      <input
        id="text"
        type="text"
        placeholder="輸入回覆後按 Enter..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        發送
      </button>

    </div>

  </section>

</section>

<script>
const WORKER =
  "https://hung.kaekae939311.workers.dev";

let currentSession = null;

const sessionList =
  document.getElementById("sessionList");

const sessionCount =
  document.getElementById("sessionCount");

const messagesBox =
  document.getElementById("messages");

const textInput =
  document.getElementById("text");

const sendButton =
  document.getElementById("sendButton");

const deleteButton =
  document.getElementById("deleteButton");

const currentSessionName =
  document.getElementById("currentSessionName");

const currentSessionStatus =
  document.getElementById("currentSessionStatus");

let lastSessionsHash = "";
let lastMessagesHash = "";
let isLoadingSessions = false;
let isLoadingMessages = false;
let newMessageTimes = new Set();

async function loadSessions() {
  if (isLoadingSessions) {
    return;
  }

  isLoadingSessions = true;

  try {
    const res =
      await fetch(`${WORKER}/sessions`, {
        cache: "no-store"
      });

    if (!res.ok) {
      throw new Error(
        `Sessions request failed: ${res.status}`
      );
    }

    const sessions =
      await res.json();

    if (!Array.isArray(sessions)) {
      throw new Error("Invalid sessions response");
    }

    sessionCount.textContent =
      `${sessions.length} sessions`;

    const sessionsHash =
      JSON.stringify(sessions);

    if (sessionsHash === lastSessionsHash) {
      return;
    }

    lastSessionsHash = sessionsHash;

    if (
      currentSession &&
      !sessions.includes(currentSession)
    ) {
      currentSession = null;
      lastMessagesHash = "";
    }

    sessionList.innerHTML = "";

    if (!sessions.length) {
      sessionList.innerHTML = `
        <div class="empty-sessions">
          目前沒有聊天室
        </div>
      `;

      currentSession = null;

      updateChatHeader();

      showEmptyMessages(
        "目前沒有任何聊天室"
      );

      return;
    }

    const sessionElements = [];

    for (const id of sessions) {
      const div =
        document.createElement("div");

      div.className = "session";

      if (id === currentSession) {
        div.classList.add("active");
      }

      div.innerHTML = `
        <div class="session-name">
          Anonymous
        </div>

        <div class="session-id">
          ${escapeHtml(id)}
        </div>
      `;

      div.addEventListener(
        "click",
        async () => {
          if (currentSession === id) {
            return;
          }

          currentSession = id;
          lastMessagesHash = "";

          document
            .querySelectorAll(".session")
            .forEach(el => {
              el.classList.remove("active");
            });

          div.classList.add("active");

          updateChatHeader();

          await loadMessages();
        }
      );

      sessionList.appendChild(div);

      sessionElements.push({
        id,
        element: div
      });
    }

    await Promise.all(
      sessionElements.map(
        async ({ id, element }) => {
          try {
            const messageRes =
              await fetch(
                `${WORKER}/messages?sessionId=${encodeURIComponent(id)}`,
                {
                  cache: "no-store"
                }
              );

            if (!messageRes.ok) {
              return;
            }

            const messageData =
              await messageRes.json();

            if (!Array.isArray(messageData)) {
              return;
            }

            const visitorMessage =
              messageData.find(
                message =>
                  message.role === "visitor" &&
                  message.name
              );

            if (visitorMessage) {
              const nameElement =
                element.querySelector(
                  ".session-name"
                );

              if (nameElement) {
                nameElement.textContent =
                  visitorMessage.name;
              }
            }
          } catch (error) {
            console.error(
              "load session name error:",
              error
            );
          }
        }
      )
    );

    if (!currentSession && sessions.length) {
      currentSession = sessions[0];

      const first =
        sessionList.querySelector(".session");

      if (first) {
        first.classList.add("active");
      }

      updateChatHeader();

      await loadMessages();
    }

  } catch (error) {
    console.error(
      "loadSessions error:",
      error
    );
  } finally {
    isLoadingSessions = false;
  }
}

async function loadMessages() {
  if (!currentSession) {
    showEmptyMessages(
      "請從左側選擇聊天室"
    );

    return;
  }

  if (isLoadingMessages) {
    return;
  }

  isLoadingMessages = true;

  const sessionAtRequest =
    currentSession;

  try {
    const res =
      await fetch(
        `${WORKER}/messages?sessionId=${encodeURIComponent(
          sessionAtRequest
        )}`,
        {
          cache: "no-store"
        }
      );

    if (!res.ok) {
      throw new Error(
        `Messages request failed: ${res.status}`
      );
    }

    const data =
      await res.json();

    if (!Array.isArray(data)) {
      throw new Error(
        "Invalid messages response"
      );
    }

    if (
      currentSession !== sessionAtRequest
    ) {
      return;
    }

    const currentHash =
      JSON.stringify(
        data.map(message => [
          message.role || "",
          message.name || "",
          message.text || "",
          message.time || ""
        ])
      );

    if (currentHash === lastMessagesHash) {
      return;
    }

    const previousMessages =
      lastMessagesHash
        ? JSON.parse(lastMessagesHash)
        : [];

    const previousIds =
      new Set(
        previousMessages.map(
          message =>
            `${message.role || ""}|${message.time || ""}|${message.text || ""}`
        )
      );

    lastMessagesHash =
      currentHash;

    messagesBox.innerHTML = "";

    if (!data.length) {
      showEmptyMessages(
        "這個聊天室目前沒有訊息"
      );

      return;
    }

    data.forEach(message => {
      const div =
        document.createElement("div");

      const isNew =
        !previousIds.has(
          `${message.role || ""}|${message.time || ""}|${message.text || ""}`
        );

      div.className =
        message.role === "admin"
          ? "message admin"
          : "message visitor";

      if (
        isNew &&
        previousMessages.length
      ) {
        div.classList.add(
          "new-message"
        );
      }

      const name =
        message.role === "admin"
          ? "Kellan"
          : (
              message.name ||
              "Visitor"
            );

      const time =
        message.time
          ? formatTime(message.time)
          : "";

      div.innerHTML = `
        <div class="message-name">
          ${escapeHtml(name)}
        </div>

        <div class="message-text">
          ${escapeHtml(message.text || "")}
        </div>

        ${
          time
            ? `
              <div class="message-time">
                ${time}
              </div>
            `
            : ""
        }
      `;

      messagesBox.appendChild(div);
    });

    messagesBox.scrollTop =
      messagesBox.scrollHeight;

  } catch (error) {
    console.error(
      "loadMessages error:",
      error
    );
  } finally {
    isLoadingMessages = false;
  }
}

async function reply() {
  if (!currentSession) {
    alert("請先選擇聊天室");
    return;
  }

  const text =
    textInput.value.trim();

  if (!text) {
    return;
  }

  sendButton.disabled = true;

  try {
    const res =
      await fetch(
        `${WORKER}/reply`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text,
            sessionId:
              currentSession
          })
        }
      );

    if (!res.ok) {
      throw new Error(
        `Reply failed: ${res.status}`
      );
    }

    const data =
      await res.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Reply failed"
      );
    }

    textInput.value = "";

    lastMessagesHash = "";

    await loadMessages();

    textInput.focus();

  } catch (error) {
    console.error(
      "reply error:",
      error
    );

    alert(
      "發送失敗，請稍後再試。"
    );
  } finally {
    sendButton.disabled = false;
  }
}

async function deleteCurrentSession() {
  if (!currentSession) {
    return;
  }

  const confirmed =
    confirm(
      "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
    );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled = true;

  const deletedSession =
    currentSession;

  try {
    const res =
      await fetch(
        `${WORKER}/sessions?sessionId=${encodeURIComponent(
          deletedSession
        )}`,
        {
          method: "DELETE"
        }
      );

    if (!res.ok) {
      throw new Error(
        `Delete failed: ${res.status}`
      );
    }

    const data =
      await res.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    currentSession = null;
    lastSessionsHash = "";
    lastMessagesHash = "";

    showEmptyMessages(
      "聊天紀錄已刪除"
    );

    updateChatHeader();

    await loadSessions();

  } catch (error) {
    console.error(
      "deleteCurrentSession error:",
      error
    );

    alert(
      "刪除失敗，請確認 Worker DELETE 功能已部署。"
    );

  } finally {
    deleteButton.disabled =
      !currentSession;
  }
}

function updateChatHeader() {
  if (!currentSession) {
    currentSessionName.textContent =
      "尚未選擇聊天室";

    currentSessionStatus.textContent =
      "Select a conversation";

    deleteButton.disabled =
      true;

    return;
  }

  currentSessionName.textContent =
    "聊天室";

  currentSessionStatus.textContent =
    currentSession;

  deleteButton.disabled =
    false;
}

function showEmptyMessages(text) {
  messagesBox.innerHTML = `
    <div class="empty-messages">
      <div>
        <div
          style="
            font-size:32px;
            margin-bottom:10px;
          "
        >
          💬
        </div>

        <div>
          ${escapeHtml(text)}
        </div>
      </div>
    </div>
  `;
}

function formatTime(timestamp) {
  const date =
    new Date(timestamp);

  return date.toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

sendButton.addEventListener(
  "click",
  reply
);

deleteButton.addEventListener(
  "click",
  deleteCurrentSession
);

textInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      reply();
    }
  }
);

loadSessions();

setInterval(
  async () => {
    await loadSessions();

    if (currentSession) {
      await loadMessages();
    }
  },
  2000
);
</script>

</body>
