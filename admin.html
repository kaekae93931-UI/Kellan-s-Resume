## admin.html

```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聊天室管理</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #sessions {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .session {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      background: #f8fafc;
    }

    .session:hover {
      background: #e2e8f0;
    }

    .session.active {
      background: #2563eb;
      color: white;
    }

    #messages {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      height: 450px;
      overflow-y: auto;
      padding: 15px;
      margin-bottom: 15px;
    }

    .visitor {
      color: #2563eb;
      margin: 8px 0;
    }

    .admin {
      color: #16a34a;
      margin: 8px 0;
    }

    #text {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <h2>網站聊天室管理</h2>

  <div id="sessions">
    <strong>聊天室列表</strong>
    <div id="sessionList"></div>
  </div>

  <div id="messages"></div>

  <input id="text" placeholder="輸入回覆後按 Enter" />

  <script>
    const WORKER = "https://hung.kaekae939311.workers.dev";

    let currentSession = null;

    // 取得聊天室列表
    async function loadSessions() {
      const res = await fetch(`${WORKER}/sessions`);
      const sessions = await res.json();

      const list = document.getElementById("sessionList");
      list.innerHTML = "";

      sessions.forEach(id => {
        const div = document.createElement("div");
        div.className = "session";
        div.textContent = id;

        if (id === currentSession) {
          div.classList.add("active");
        }

        div.onclick = () => {
          currentSession = id;

          document.querySelectorAll(".session").forEach(el =>
            el.classList.remove("active")
          );

          div.classList.add("active");

          loadMessages();
        };

        list.appendChild(div);
      });

      // 自動選第一個聊天室
      if (!currentSession && sessions.length > 0) {
        currentSession = sessions[0];
        list.firstChild.classList.add("active");
        await loadMessages();
      }
    }

    // 載入訊息
    async function loadMessages() {
      if (!currentSession) return;

      const res = await fetch(
        `${WORKER}/messages?sessionId=${currentSession}`
      );

      const data = await res.json();

      const box = document.getElementById("messages");
      box.innerHTML = "";

      data.forEach(m => {
        const div = document.createElement("div");
        div.className = m.role === "admin" ? "admin" : "visitor";

        const name = m.name ? `${m.name}: ` : "";

        div.textContent = `${name}${m.text}`;

        box.appendChild(div);
      });

      box.scrollTop = box.scrollHeight;
    }

    // 回覆
    async function reply() {
      if (!currentSession) {
        alert("請先選擇聊天室");
        return;
      }

      const input = document.getElementById("text");
      const text = input.value.trim();

      if (!text) return;

      await fetch(`${WORKER}/reply`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text,
          sessionId: currentSession
        })
      });

      input.value = "";
      await loadMessages();
    }

    document.getElementById("text").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        reply();
      }
    });

    // 初始載入
    loadSessions();

    // 每 2 秒更新
    setInterval(async () => {
      await loadSessions();
      await loadMessages();
    }, 2000);
  </script>

</body>
</html>
```
