<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室管理後台</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #071525;
  color: #e8f0fa;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
  overflow: hidden;
}

button,
input {
  font: inherit;
}

.topbar {
  height: 72px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: #081728;
  border-bottom: 1px solid #172a40;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: #f4f8ff;
}

.brand p {
  margin: 4px 0 0;
  font-size: 12px;
  color: #627b98;
}

.online-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #9eb3ca;
}

.online-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34,197,94,.7);
}

.dashboard {
  width: 100%;
  height: calc(100vh - 72px);
  display: flex;
  min-height: 0;
}

.sidebar {
  width: 380px;
  min-width: 380px;
  height: 100%;
  background: #081728;
  border-right: 1px solid #172a40;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar-header {
  flex: 0 0 auto;
  padding: 20px 22px;
  border-bottom: 1px solid #172a40;
}

.sidebar-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sidebar-title strong {
  font-size: 16px;
  color: #eef5ff;
}

.session-count {
  color: #6d87a5;
  font-size: 12px;
  white-space: nowrap;
}

#sessionList {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px;
}

#sessionList::-webkit-scrollbar,
#messages::-webkit-scrollbar {
  width: 7px;
}

#sessionList::-webkit-scrollbar-track,
#messages::-webkit-scrollbar-track {
  background: transparent;
}

#sessionList::-webkit-scrollbar-thumb,
#messages::-webkit-scrollbar-thumb {
  background: #263c54;
  border-radius: 10px;
}

.session {
  position: relative;
  width: 100%;
  min-height: 74px;
  padding: 15px 18px;
  margin-bottom: 4px;
  border: 1px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  transition:
    background .15s ease,
    border-color .15s ease;
}

.session:hover {
  background: #0d2037;
  border-color: #193b5f;
}

.session.active {
  background: #0d2547;
  border-color: #20508a;
}

.session-name {
  padding-right: 22px;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.4;
  color: #eef5ff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-id {
  margin-top: 5px;
  color: #4f6d8d;
  font-size: 11px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session.has-new {
  background: rgba(34,197,94,.09);
  border-color: rgba(34,197,94,.3);
}

.session.has-new .session-name {
  color: #4ade80;
}

.session.has-new::after {
  content: "";
  position: absolute;
  right: 15px;
  top: 21px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34,197,94,.8);
}

.session.active.has-new {
  background: #102d49;
  border-color: rgba(34,197,94,.42);
}

.empty-sessions {
  padding: 40px 20px;
  text-align: center;
  color: #59728f;
  font-size: 13px;
}

.chat-panel {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #071525;
}

.chat-header {
  flex: 0 0 72px;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 22px;
  background: #081728;
  border-bottom: 1px solid #172a40;
}

.chat-user {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 13px;
}

.chat-avatar {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg,#2563eb,#6d3df5);
  color: white;
  font-size: 20px;
  font-weight: 700;
}

.chat-user > div:last-child {
  min-width: 0;
}

.chat-user strong {
  display: block;
  max-width: 100%;
  color: #f3f7ff;
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-user span {
  display: block;
  margin-top: 3px;
  max-width: 100%;
  color: #557492;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.delete-button {
  flex: 0 0 auto;
  min-height: 42px;
  padding: 0 15px;
  border: 1px solid rgba(239,68,68,.28);
  border-radius: 10px;
  background: rgba(127,29,29,.16);
  color: #f87171;
  cursor: pointer;
}

.delete-button:hover:not(:disabled) {
  background: rgba(239,68,68,.15);
  border-color: rgba(239,68,68,.5);
}

.delete-button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.mobile-back {
  display: none;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  width: fit-content;
  max-width: min(68%, 680px);
  min-width: 0;
  padding: 11px 14px;
  border-radius: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.message-name {
  margin-bottom: 4px;
  font-size: 11px;
  font-weight: 700;
  opacity: .78;
}

.message-text {
  white-space: pre-wrap;
}

.message-time {
  margin-top: 7px;
  font-size: 10px;
  opacity: .5;
}

.message.visitor {
  align-self: flex-start;
  background: #12283d;
  border: 1px solid #1c3b56;
  color: #dce9f7;
  border-radius: 5px 15px 15px 15px;
}

.message.visitor .message-name {
  color: #4ade80;
}

.message.visitor.new-message {
  background: rgba(34,197,94,.13);
  border-color: rgba(34,197,94,.5);
  box-shadow: 0 0 0 1px rgba(34,197,94,.05);
}

.message.admin {
  align-self: flex-end;
  background: #2563eb;
  border: 1px solid #3474ec;
  color: #fff;
  border-radius: 15px 5px 15px 15px;
}

.message.admin .message-name {
  color: #dbeafe;
}

.empty-messages {
  flex: 1;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #58728e;
}

.composer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  background: #081728;
  border-top: 1px solid #172a40;
}

#text {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 0 15px;
  border: 1px solid #1b344d;
  border-radius: 12px;
  outline: none;
  background: #0b1c30;
  color: #e9f2fc;
  font-size: 14px;
}

#text::placeholder {
  color: #526c88;
}

#text:focus {
  border-color: #2865a5;
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.send-button {
  flex: 0 0 auto;
  height: 46px;
  padding: 0 20px;
  border: 0;
  border-radius: 12px;
  background: #2563eb;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.send-button:hover:not(:disabled) {
  background: #3474ec;
}

.send-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

@media (max-width: 900px) {
  .sidebar {
    width: 300px;
    min-width: 300px;
  }

  #messages {
    padding: 20px;
  }

  .message {
    max-width: 76%;
  }
}

@media (max-width: 700px) {
  body {
    overflow: hidden;
  }

  .topbar {
    height: 56px;
    padding: 0 13px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .brand p {
    display: none;
  }

  .online-status {
    font-size: 10px;
  }

  .dashboard {
    position: relative;
    display: block;
    height: calc(100dvh - 56px);
  }

  .sidebar {
    width: 100%;
    min-width: 0;
    height: 100%;
    border-right: 0;
  }

  .sidebar-header {
    padding: 13px 15px;
  }

  #sessionList {
    padding: 6px;
  }

  .session {
    min-height: 68px;
    padding: 14px 15px;
    border-radius: 10px;
  }

  .session.has-new::after {
    right: 14px;
    top: 20px;
    width: 9px;
    height: 9px;
  }

  .chat-panel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: translateX(100%);
    transition: transform .18s ease;
    z-index: 10;
  }

  .dashboard.chat-open .chat-panel {
    transform: translateX(0);
  }

  .mobile-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    margin-right: 1px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #9eb3ca;
    font-size: 24px;
    cursor: pointer;
  }

  .chat-header {
    flex: 0 0 62px;
    min-height: 62px;
    padding: 0 9px;
    gap: 7px;
  }

  .chat-avatar {
    width: 40px;
    height: 40px;
    flex-basis: 40px;
    font-size: 17px;
  }

  .chat-user {
    flex: 1;
    min-width: 0;
    gap: 8px;
  }

  .chat-user strong {
    font-size: 14px;
  }

  .chat-user span {
    font-size: 10px;
  }

  .delete-button {
    min-height: 35px;
    padding: 0 9px;
    font-size: 11px;
  }

  #messages {
    padding: 12px 9px;
    gap: 8px;
  }

  .message {
    max-width: 84%;
    width: fit-content;
    padding: 8px 11px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 13px;
  }

  .message.visitor {
    border-radius: 5px 13px 13px 13px;
  }

  .message.admin {
    border-radius: 13px 5px 13px 13px;
  }

  .message-name {
    margin-bottom: 3px;
    font-size: 10px;
  }

  .message-time {
    margin-top: 5px;
    font-size: 9px;
  }

  .composer {
    padding: 8px;
    gap: 7px;
  }

  #text {
    height: 42px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 14px;
  }

  .send-button {
    height: 42px;
    padding: 0 14px;
    border-radius: 10px;
    font-size: 13px;
  }
}

@media (max-width: 430px) {
  .topbar {
    padding: 0 10px;
  }

  .online-status {
    font-size: 9px;
  }

  .session-name {
    font-size: 14px;
  }

  .session-id {
    font-size: 10px;
  }

  .chat-header {
    padding: 0 6px;
  }

  .delete-button {
    padding: 0 7px;
    font-size: 10px;
  }

  #messages {
    padding: 10px 7px;
  }

  .message {
    max-width: 87%;
    font-size: 13px;
    padding: 8px 10px;
  }

  .composer {
    padding: 7px;
  }

  #text {
    height: 40px;
    font-size: 13px;
  }

  .send-button {
    height: 40px;
    padding: 0 12px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <h1>聊天室管理後台</h1>
    <p>Chat Administration · Kellan Resume Assistant</p>
  </div>

  <div class="online-status">
    <span class="online-dot"></span>
    System Online
  </div>
</header>

<section class="dashboard" id="dashboard">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-title">
        <strong>聊天室列表</strong>

        <span
          id="sessionCount"
          class="session-count"
        >
          0 sessions
        </span>
      </div>
    </div>

    <div id="sessionList"></div>

  </aside>

  <section class="chat-panel">

    <header class="chat-header">

      <button
        id="mobileBack"
        class="mobile-back"
        type="button"
        aria-label="返回聊天室列表"
      >
        ‹
      </button>

      <div class="chat-user">

        <div class="chat-avatar">
          K
        </div>

        <div>
          <strong id="currentSessionName">
            尚未選擇聊天室
          </strong>

          <span id="currentSessionStatus">
            Select a conversation
          </span>
        </div>

      </div>

      <button
        id="deleteButton"
        class="delete-button"
        type="button"
        disabled
      >
        🗑 刪除紀錄
      </button>

    </header>

    <div id="messages">

      <div class="empty-messages">

        <div>
          <div
            style="
              font-size:32px;
              margin-bottom:10px;
            "
          >
            💬
          </div>

          <div>
            請從左側選擇聊天室
          </div>
        </div>

      </div>

    </div>

    <div class="composer">

      <input
        id="text"
        type="text"
        placeholder="輸入回覆後按 Enter..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        發送
      </button>

    </div>

  </section>

</section>

<script>
const WORKER =
  "https://hung.kaekae939311.workers.dev";

let currentSession = null;

let sessionsCache = [];
let messagesCache = new Map();
let sessionElements = new Map();
let sessionNames = new Map();
let sessionLastMessage = new Map();
let unreadSessions = new Set();

let isLoadingSessions = false;
let isLoadingMessages = false;
let isSending = false;

const dashboard =
  document.getElementById("dashboard");

const sessionList =
  document.getElementById("sessionList");

const sessionCount =
  document.getElementById("sessionCount");

const messagesBox =
  document.getElementById("messages");

const textInput =
  document.getElementById("text");

const sendButton =
  document.getElementById("sendButton");

const deleteButton =
  document.getElementById("deleteButton");

const currentSessionName =
  document.getElementById("currentSessionName");

const currentSessionStatus =
  document.getElementById("currentSessionStatus");

const mobileBack =
  document.getElementById("mobileBack");

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatTime(timestamp) {
  if (!timestamp) {
    return "";
  }

  return new Date(timestamp).toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function getMessageHash(messages) {
  return JSON.stringify(
    messages.map(message => [
      message.role || "",
      message.name || "",
      message.text || "",
      message.time || ""
    ])
  );
}

function getLatestMessage(messages) {
  if (!messages || !messages.length) {
    return null;
  }

  return messages[messages.length - 1];
}

function getVisitorName(messages) {
  if (!messages || !messages.length) {
    return "Anonymous";
  }

  const visitor =
    messages.find(
      message =>
        message.role === "visitor" &&
        message.name
    );

  return visitor
    ? visitor.name
    : "Anonymous";
}

function updateChatHeader() {
  if (!currentSession) {
    currentSessionName.textContent =
      "尚未選擇聊天室";

    currentSessionStatus.textContent =
      "Select a conversation";

    deleteButton.disabled = true;

    return;
  }

  currentSessionName.textContent =
    sessionNames.get(currentSession) ||
    "Anonymous";

  currentSessionStatus.textContent =
    currentSession;

  deleteButton.disabled = false;
}

function showEmptyMessages(text) {
  messagesBox.innerHTML = `
    <div class="empty-messages">
      <div>
        <div
          style="
            font-size:32px;
            margin-bottom:10px;
          "
        >
          💬
        </div>
        <div>
          ${escapeHtml(text)}
        </div>
      </div>
    </div>
  `;
}

function createSessionElement(id) {
  const div =
    document.createElement("div");

  div.className = "session";
  div.dataset.sessionId = id;

  div.addEventListener(
    "click",
    async () => {
      await selectSession(id);
    }
  );

  return div;
}

function updateSessionElement(id) {
  const div =
    sessionElements.get(id);

  if (!div) {
    return;
  }

  const name =
    sessionNames.get(id) ||
    "Anonymous";

  div.innerHTML = `
    <div class="session-name">
      ${escapeHtml(name)}
    </div>

    <div class="session-id">
      ${escapeHtml(id)}
    </div>
  `;

  div.classList.toggle(
    "active",
    id === currentSession
  );

  div.classList.toggle(
    "has-new",
    unreadSessions.has(id)
  );
}

function rebuildSessionElements(sessions) {
  const existing =
    new Map(sessionElements);

  const fragment =
    document.createDocumentFragment();

  const newMap =
    new Map();

  sessions.forEach(id => {
    let div = existing.get(id);

    if (!div) {
      div = createSessionElement(id);
    }

    newMap.set(id, div);
    fragment.appendChild(div);
  });

  sessionElements = newMap;

  sessionList.replaceChildren(fragment);

  sessions.forEach(id => {
    updateSessionElement(id);
  });
}

async function fetchSessions() {
  const response =
    await fetch(
      `${WORKER}/sessions`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {
    throw new Error(
      `Sessions request failed: ${response.status}`
    );
  }

  const data =
    await response.json();

  if (!Array.isArray(data)) {
    throw new Error(
      "Invalid sessions response."
    );
  }

  return data;
}

async function fetchMessages(sessionId) {
  const response =
    await fetch(
      `${WORKER}/messages?sessionId=${encodeURIComponent(sessionId)}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {
    throw new Error(
      `Messages request failed: ${response.status}`
    );
  }

  const data =
    await response.json();

  if (!Array.isArray(data)) {
    throw new Error(
      "Invalid messages response."
    );
  }

  return data;
}

function renderMessages(messages) {
  messagesBox.innerHTML = "";

  if (!messages.length) {
    showEmptyMessages(
      "這個聊天室目前沒有訊息"
    );
    return;
  }

  messages.forEach(message => {
    const div =
      document.createElement("div");

    const isAdmin =
      message.role === "admin";

    div.className =
      isAdmin
        ? "message admin"
        : "message visitor";

    const name =
      isAdmin
        ? "Kellan"
        : message.name || "Anonymous";

    div.innerHTML = `
      <div class="message-name">
        ${escapeHtml(name)}
      </div>

      <div class="message-text">
        ${escapeHtml(message.text || "")}
      </div>

      ${
        message.time
          ? `
            <div class="message-time">
              ${escapeHtml(
                formatTime(message.time)
              )}
            </div>
          `
          : ""
      }
    `;

    messagesBox.appendChild(div);
  });

  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}

async function loadSessionMessages(
  sessionId,
  forceRender = false
) {
  if (!sessionId) {
    return;
  }

  if (isLoadingMessages) {
    return;
  }

  isLoadingMessages = true;

  try {
    const messages =
      await fetchMessages(sessionId);

    const oldMessages =
      messagesCache.get(sessionId) || [];

    const oldHash =
      getMessageHash(oldMessages);

    const newHash =
      getMessageHash(messages);

    messagesCache.set(
      sessionId,
      messages
    );

    sessionNames.set(
      sessionId,
      getVisitorName(messages)
    );

    const latest =
      getLatestMessage(messages);

    sessionLastMessage.set(
      sessionId,
      latest
    );

    if (
      latest &&
      latest.role === "visitor" &&
      oldHash &&
      oldHash !== newHash &&
      sessionId !== currentSession
    ) {
      unreadSessions.add(sessionId);
    }

    if (sessionId === currentSession) {
      unreadSessions.delete(sessionId);
    }

    updateSessionElement(sessionId);

    if (
      sessionId === currentSession &&
      (
        forceRender ||
        oldHash !== newHash
      )
    ) {
      renderMessages(messages);
    }

    updateChatHeader();

  } catch (error) {
    console.error(
      "loadSessionMessages error:",
      error
    );
  } finally {
    isLoadingMessages = false;
  }
}

async function selectSession(id) {
  currentSession = id;

  unreadSessions.delete(id);

  updateChatHeader();

  dashboard.classList.add(
    "chat-open"
  );

  updateSessionElement(id);

  const cached =
    messagesCache.get(id);

  if (cached) {
    renderMessages(cached);
  } else {
    showEmptyMessages(
      "載入訊息中..."
    );
  }

  await loadSessionMessages(
    id,
    true
  );

  textInput.focus();
}

function updateSessionsWithoutFlicker(
  sessions
) {
  const changed =
    JSON.stringify(sessions) !==
    JSON.stringify(sessionsCache);

  sessionsCache = [...sessions];

  sessionCount.textContent =
    `${sessions.length} sessions`;

  if (
    !changed &&
    sessionElements.size === sessions.length
  ) {
    sessions.forEach(id => {
      updateSessionElement(id);
    });

    return;
  }

  rebuildSessionElements(
    sessions
  );
}

async function loadSessions() {
  if (isLoadingSessions) {
    return;
  }

  isLoadingSessions = true;

  try {
    const sessions =
      await fetchSessions();

    const validSessions =
      new Set(sessions);

    for (const id of unreadSessions) {
      if (!validSessions.has(id)) {
        unreadSessions.delete(id);
      }
    }

    if (
      currentSession &&
      !validSessions.has(currentSession)
    ) {
      currentSession = null;
      dashboard.classList.remove(
        "chat-open"
      );
      updateChatHeader();
      showEmptyMessages(
        "聊天室已被刪除"
      );
    }

    updateSessionsWithoutFlicker(
      sessions
    );

    const tasks =
      sessions.map(async id => {
        if (!messagesCache.has(id)) {
          await loadSessionMessages(
            id,
            false
          );
        }
      });

    await Promise.all(tasks);

    sessions.forEach(id => {
      updateSessionElement(id);
    });

    if (
      !currentSession &&
      sessions.length > 0 &&
      window.innerWidth > 700
    ) {
      await selectSession(
        sessions[0]
      );
    }

    if (!sessions.length) {
      showEmptyMessages(
        "目前沒有任何聊天室"
      );
    }

  } catch (error) {
    console.error(
      "loadSessions error:",
      error
    );
  } finally {
    isLoadingSessions = false;
  }
}

async function refreshAllMessages() {
  if (!sessionsCache.length) {
    return;
  }

  const tasks =
    sessionsCache.map(id =>
      loadSessionMessages(
        id,
        false
      )
    );

  await Promise.all(tasks);
}

async function reply() {
  if (!currentSession) {
    alert("請先選擇聊天室");
    return;
  }

  const text =
    textInput.value.trim();

  if (!text || isSending) {
    return;
  }

  isSending = true;
  sendButton.disabled = true;

  try {
    const response =
      await fetch(
        `${WORKER}/reply`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text,
            sessionId:
              currentSession
          })
        }
      );

    if (!response.ok) {
      throw new Error(
        `Reply failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Reply failed"
      );
    }

    textInput.value = "";

    await loadSessionMessages(
      currentSession,
      true
    );

    textInput.focus();

  } catch (error) {
    console.error(
      "reply error:",
      error
    );

    alert(
      "發送失敗，請稍後再試。"
    );

  } finally {
    isSending = false;
    sendButton.disabled = false;
  }
}

async function deleteCurrentSession() {
  if (!currentSession) {
    return;
  }

  const sessionToDelete =
    currentSession;

  const confirmed =
    confirm(
      "確定要刪除這個聊天室的所有紀錄嗎？\n\n此操作無法復原。"
    );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled = true;

  try {
    const response =
      await fetch(
        `${WORKER}/sessions?sessionId=${encodeURIComponent(sessionToDelete)}`,
        {
          method: "DELETE"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Delete failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    messagesCache.delete(
      sessionToDelete
    );

    sessionNames.delete(
      sessionToDelete
    );

    sessionLastMessage.delete(
      sessionToDelete
    );

    unreadSessions.delete(
      sessionToDelete
    );

    sessionElements.delete(
      sessionToDelete
    );

    currentSession = null;

    dashboard.classList.remove(
      "chat-open"
    );

    updateChatHeader();

    showEmptyMessages(
      "聊天紀錄已刪除"
    );

    await loadSessions();

  } catch (error) {
    console.error(
      "deleteCurrentSession error:",
      error
    );

    alert(
      "刪除失敗，請稍後再試。"
    );

  } finally {
    deleteButton.disabled =
      !currentSession;
  }
}

function goBackToSessions() {
  dashboard.classList.remove(
    "chat-open"
  );
}

sendButton.addEventListener(
  "click",
  reply
);

deleteButton.addEventListener(
  "click",
  deleteCurrentSession
);

textInput.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      reply();
    }
  }
);

mobileBack.addEventListener(
  "click",
  goBackToSessions
);

loadSessions();

setInterval(
  async () => {
    await loadSessions();
    await refreshAllMessages();
  },
  2000
);
</script>

</body>
</html>
