<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>聊天室管理後台</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#0b1328;color:#e5e7eb;overflow:hidden}
button,input{font:inherit}
.topbar{height:92px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;background:#0d172c;border-bottom:1px solid rgba(148,163,184,.1)}
.brand h1{margin:0;color:#f8fafc;font-size:24px;font-weight:700}
.brand p{margin:7px 0 0;color:#7183a3;font-size:14px}
.online-status{display:flex;align-items:center;gap:9px;padding:9px 16px;border:1px solid rgba(34,197,94,.18);border-radius:999px;background:rgba(34,197,94,.08);color:#4ade80;font-size:13px}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.65)}
.dashboard{height:calc(100vh - 92px);display:flex;min-width:0;min-height:0;overflow:hidden}
.sidebar{width:355px;min-width:355px;height:100%;display:flex;flex-direction:column;background:#0b1428;border-right:1px solid rgba(148,163,184,.1)}
.sidebar-header{padding:22px 24px;border-bottom:1px solid rgba(148,163,184,.08)}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sidebar-title strong{color:#f8fafc;font-size:16px}
.session-count{padding:6px 11px;border-radius:999px;background:#17243d;color:#7890b5;font-size:12px}
#sessionList{flex:1;min-height:0;padding:12px;overflow-y:auto}
.session-item{width:100%;padding:13px 12px;display:flex;align-items:center;gap:12px;border-radius:10px;cursor:pointer;transition:.15s;background:transparent}
.session-item:hover{background:#121f38}
.session-item.active{background:#172a4a}
.session-item-avatar{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:700}
.session-item-content{min-width:0;display:flex;flex-direction:column}
.session-item-content strong{color:#e2e8f0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item-content span{margin-top:3px;color:#64748b;font-size:11px}
.chat-panel{flex:1;width:0;min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;background:#0f172a;overflow:hidden}
.chat-header{flex:0 0 auto;min-height:86px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(148,163,184,.1)}
.chat-user{min-width:0;display:flex;align-items:center;gap:14px}
.chat-avatar{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:20px;font-weight:700}
.chat-user>div:last-child{min-width:0;display:flex;flex-direction:column}
#currentSessionName{color:#f8fafc;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#currentSessionStatus{margin-top:3px;color:#64748b;font-size:12px}
.delete-button{height:40px;padding:0 14px;flex:0 0 auto;border:1px solid rgba(248,113,113,.2);border-radius:9px;background:rgba(127,29,29,.12);color:#f87171;cursor:pointer}
.delete-button:hover:not(:disabled){background:rgba(127,29,29,.25)}
.delete-button:disabled{opacity:.45;cursor:not-allowed}
#messages{flex:1 1 auto;width:100%;min-width:0;min-height:0;padding:28px 30px;display:flex;flex-direction:column;align-items:stretch;gap:16px;overflow-x:hidden;overflow-y:auto}
#messages .message{width:100%;max-width:100%;min-width:0;display:flex}
#messages .message.visitor{justify-content:flex-start}
#messages .message.admin{justify-content:flex-end}
.message-bubble{width:fit-content;max-width:min(720px,75%);padding:13px 17px;border-radius:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.message.visitor .message-bubble{background:#172554;color:#e2e8f0;border:1px solid rgba(59,130,246,.16);border-top-left-radius:5px}
.message.admin .message-bubble{background:#2563eb;color:#fff;border:1px solid rgba(96,165,250,.18);border-top-right-radius:5px}
.message-name{font-size:11px;opacity:.6;margin-bottom:5px}
.empty-messages{flex:1;width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;text-align:center}
.composer{flex:0 0 auto;width:100%;padding:16px 22px;display:flex;align-items:center;gap:10px;border-top:1px solid rgba(148,163,184,.1)}
#text{flex:1;width:100%;min-width:0;height:46px;padding:0 15px;border:1px solid #263653;border-radius:10px;outline:0;background:#111c33;color:#e2e8f0;font-size:14px}
#text:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
#text::placeholder{color:#64748b}
.send-button{height:46px;padding:0 20px;flex:0 0 auto;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.send-button:hover:not(:disabled){background:#1d4ed8}
.send-button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:800px){
.topbar{height:76px;padding:0 18px}.brand h1{font-size:19px}.brand p{font-size:11px}.dashboard{height:calc(100vh - 76px)}
.sidebar{width:280px;min-width:280px}#messages{padding:20px 16px}.message-bubble{max-width:85%}
}
</style>
</head>
<body>

<header class="topbar">
<div class="brand">
<h1>聊天室管理後台</h1>
<p>Chat Administration · Kellan Resume Assistant</p>
</div>
<div class="online-status"><span class="online-dot"></span>System Online</div>
</header>

<section class="dashboard">
<aside class="sidebar">
<div class="sidebar-header">
<div class="sidebar-title">
<strong>聊天室列表</strong>
<span id="sessionCount" class="session-count">0 sessions</span>
</div>
</div>
<div id="sessionList"></div>
</aside>

<section class="chat-panel">
<header class="chat-header">
<div class="chat-user">
<div class="chat-avatar">K</div>
<div>
<strong id="currentSessionName">尚未選擇聊天室</strong>
<span id="currentSessionStatus">Select a conversation</span>
</div>
</div>
<button id="deleteButton" class="delete-button" type="button" disabled>🗑 刪除紀錄</button>
</header>

<div id="messages">
<div class="empty-messages">
<div>
<div style="font-size:32px;margin-bottom:10px">💬</div>
<div>請從左側選擇聊天室</div>
</div>
</div>
</div>

<div class="composer">
<input id="text" type="text" placeholder="輸入回覆後按 Enter..." autocomplete="off">
<button id="sendButton" class="send-button" type="button">發送</button>
</div>
</section>
</section>

<script>
const API="";

let sessions=[];
let currentSessionId=null;

const sessionList=document.getElementById("sessionList");
const sessionCount=document.getElementById("sessionCount");
const messages=document.getElementById("messages");
const text=document.getElementById("text");
const sendButton=document.getElementById("sendButton");
const deleteButton=document.getElementById("deleteButton");
const currentSessionName=document.getElementById("currentSessionName");
const currentSessionStatus=document.getElementById("currentSessionStatus");

async function loadSessions(){
  try{
    const r=await fetch(`${API}/sessions`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    sessions=Array.isArray(data)?data:[];
    sessionCount.textContent=`${sessions.length} sessions`;
    renderSessions();
  }catch(e){console.error("loadSessions:",e)}
}

function renderSessions(){
  sessionList.innerHTML="";
  if(!sessions.length){
    sessionList.innerHTML='<div style="padding:30px 15px;text-align:center;color:#64748b;font-size:13px">尚無聊天室</div>';
    return;
  }

  sessions.forEach(sessionId=>{
    const item=document.createElement("div");
    item.className="session-item"+(sessionId===currentSessionId?" active":"");
    item.innerHTML=`
      <div class="session-item-avatar">K</div>
      <div class="session-item-content">
        <strong>${escapeHtml(sessionId)}</strong>
        <span>Chat session</span>
      </div>`;
    item.onclick=()=>selectSession(sessionId);
    sessionList.appendChild(item);
  });
}

async function selectSession(sessionId){
  currentSessionId=sessionId;
  currentSessionName.textContent=sessionId;
  currentSessionStatus.textContent="Conversation active";
  deleteButton.disabled=false;
  renderSessions();
  await loadMessages(sessionId);
}

async function loadMessages(sessionId){
  try{
    const r=await fetch(`${API}/messages?sessionId=${encodeURIComponent(sessionId)}`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    renderMessages(Array.isArray(data)?data:[]);
  }catch(e){console.error("loadMessages:",e)}
}

function renderMessages(data){
  messages.innerHTML="";

  if(!data.length){
    messages.innerHTML=`
      <div class="empty-messages">
        <div>
          <div style="font-size:32px;margin-bottom:10px">💬</div>
          <div>尚無訊息</div>
        </div>
      </div>`;
    return;
  }

  data.forEach(message=>{
    const wrapper=document.createElement("div");
    wrapper.className=`message ${message.role==="admin"?"admin":"visitor"}`;

    const bubble=document.createElement("div");
    bubble.className="message-bubble";

    const name=message.role==="admin"?"管理員":(message.name||"Anonymous");
    bubble.innerHTML=`
      <div class="message-name">${escapeHtml(name)}</div>
      <div>${escapeHtml(message.text||"")}</div>`;

    wrapper.appendChild(bubble);
    messages.appendChild(wrapper);
  });

  requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight);
}

async function sendMessage(){
  const value=text.value.trim();
  if(!value||!currentSessionId)return;

  sendButton.disabled=true;

  try{
    const r=await fetch(`${API}/reply`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:value,sessionId:currentSessionId})
    });

    const result=await r.json();

    if(!r.ok||!result.ok)throw new Error(result.error||"Reply failed");

    text.value="";
    await loadMessages(currentSessionId);
  }catch(e){
    console.error("sendMessage:",e);
    alert("發送失敗");
  }finally{
    sendButton.disabled=false;
    text.focus();
  }
}

async function deleteCurrentSession(){
  if(!currentSessionId)return;

  if(!confirm("確定要刪除這個聊天室的所有紀錄嗎？"))return;

  const deletingId=currentSessionId;
  deleteButton.disabled=true;

  try{
    const r=await fetch(`${API}/sessions?sessionId=${encodeURIComponent(deletingId)}`,{
      method:"DELETE"
    });

    const result=await r.json();

    if(!r.ok||!result.ok)throw new Error(result.error||"Delete failed");

    sessions=sessions.filter(id=>id!==deletingId);
    currentSessionId=null;
    currentSessionName.textContent="尚未選擇聊天室";
    currentSessionStatus.textContent="Select a conversation";

    messages.innerHTML=`
      <div class="empty-messages">
        <div>
          <div style="font-size:32px;margin-bottom:10px">💬</div>
          <div>請從左側選擇聊天室</div>
        </div>
      </div>`;

    sessionCount.textContent=`${sessions.length} sessions`;
    renderSessions();
  }catch(e){
    console.error("deleteSession:",e);
    alert("刪除失敗");
    deleteButton.disabled=false;
  }
}

function escapeHtml(value){
  const div=document.createElement("div");
  div.textContent=String(value??"");
  return div.innerHTML;
}

sendButton.addEventListener("click",sendMessage);
deleteButton.addEventListener("click",deleteCurrentSession);

text.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

loadSessions();

setInterval(()=>{
  loadSessions();
  if(currentSessionId)loadMessages(currentSessionId);
},5000);
</script>

</body>
</html>
